<meta name="description" content="名前と生年月日、5つの質問から、36の生涯の中からあなたの前世を読み解きます。時代・土地・生業、今世に残った癖、持ち越した課題、そして前世からの伝言。">
<meta property="og:title" content="前世診断">
<meta property="og:description" content="名前と生年月日、5つの質問から、あなたの前世を読み解きます。">

<style>
  :root {
    --paper: #ffffff; --panel: #faf8f2; --line: #e7e1d1;
    --gold: #a3801a; --gold-hi: #c9a227;
    --ink: #17140d; --body-c: #4d4737; --faint: #948c74;
    --night: #141a2e; --night-2: #1d2540; --night-line: #2e3858; --moon: #efe6c8;
    --mincho: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    --gothic: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--paper); color: var(--body-c); font-family: var(--gothic); line-height: 1.9; margin: 0; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 80px; }

  header { text-align: center; padding: 64px 20px 36px; }
  .brand { font-size: 11px; letter-spacing: .3em; color: var(--gold); font-weight: 500; }
  h1 { font-family: var(--mincho); font-weight: 700; font-size: clamp(32px, 7vw, 46px); color: var(--ink); letter-spacing: .2em; line-height: 1.4; margin: 10px 0 12px; }
  .lede { font-size: 13px; color: var(--faint); margin: 0; letter-spacing: .06em; }

  h2 { font-family: var(--mincho); font-weight: 700; font-size: 19px; color: var(--ink); letter-spacing: .24em; margin: 48px 0 18px; display: flex; align-items: center; gap: 16px; }
  h2 small { font-family: var(--gothic); font-size: 10px; letter-spacing: .26em; color: var(--faint); font-weight: 500; flex: none; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* 入力 */
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
  label.f { display: block; font-size: 12px; letter-spacing: .12em; color: var(--faint); }
  label.f input { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; font: 16px var(--gothic); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 0; }
  label.f input:focus { outline: 2px solid var(--gold-hi); outline-offset: -1px; }

  .q { margin: 0 0 26px; }
  .q p { font-family: var(--mincho); font-size: 15.5px; color: var(--ink); margin: 0 0 10px; letter-spacing: .06em; }
  .q p b { color: var(--gold); margin-right: 8px; }
  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 560px) { .opts { grid-template-columns: 1fr 1fr; } }
  .opts input { position: absolute; opacity: 0; pointer-events: none; }
  .opts label { display: block; text-align: center; padding: 11px 6px; font-size: 13px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .opts label:hover { border-color: var(--gold-hi); }
  .opts input:checked + label { background: var(--ink); color: var(--moon); border-color: var(--ink); }
  .opts input:focus-visible + label { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

  .go { display: block; width: 100%; margin-top: 34px; padding: 18px; font: 700 16px var(--mincho); letter-spacing: .4em; color: var(--moon); background: var(--ink); border: 0; cursor: pointer; }
  .go:hover { background: #2a2418; }
  .err { color: #9a3b2a; font-size: 13px; text-align: center; margin: 12px 0 0; min-height: 1.5em; }

  /* 読み解き中 */
  .reading { display: none; text-align: center; padding: 70px 0; }
  .reading.on { display: block; }
  .orb { width: 92px; height: 92px; margin: 0 auto 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8dc, var(--gold-hi) 45%, #5a4410 100%); box-shadow: 0 0 40px rgba(201,162,39,.45); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.9); box-shadow: 0 0 70px rgba(201,162,39,.7); } }
  .reading p { font-family: var(--mincho); color: var(--ink); letter-spacing: .14em; margin: 0; }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }

  /* 結果 */
  #result { display: none; }
  #result.on { display: block; }
  .card { background: var(--night); color: #cfd3e3; padding: 44px 30px 38px; position: relative; overflow: hidden; margin-top: 40px; }
  .card::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 78% 12%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 88% 46%, #ffe9a8 50%, transparent 51%), radial-gradient(1px 1px at 32% 8%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 60% 30%, #cfd8ff 50%, transparent 51%), radial-gradient(1px 1px at 6% 62%, #fff 50%, transparent 51%); opacity: .7; pointer-events: none; }
  .card > * { position: relative; }
  .card .who { font-size: 11px; letter-spacing: .3em; color: var(--gold-hi); text-align: center; margin: 0; }
  .card .era { text-align: center; font-size: 13px; letter-spacing: .14em; color: #9aa2c0; margin: 18px 0 4px; }
  .card .role { font-family: var(--mincho); font-weight: 700; font-size: clamp(26px, 6vw, 36px); color: var(--moon); text-align: center; letter-spacing: .14em; line-height: 1.5; margin: 0; }
  .card .pname { text-align: center; font-family: var(--mincho); font-size: 15px; color: #c8cde0; margin: 8px 0 0; letter-spacing: .1em; }
  .card .story { font-family: var(--mincho); font-size: 15px; line-height: 2.1; color: #dfe2ee; margin: 30px 0 0; padding-top: 26px; border-top: 1px solid var(--night-line); }
  .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 28px; }
  .meta div { background: var(--night-2); border: 1px solid var(--night-line); padding: 12px 8px; text-align: center; }
  .meta small { display: block; font-size: 10.5px; letter-spacing: .18em; color: #8890b0; }
  .meta .wide { grid-column: span 2; }
  .meta .sw { display: inline-block; width: .8em; height: .8em; border-radius: 50%; margin-right: 6px; vertical-align: -.05em; border: 1px solid rgba(255,255,255,.3); }
  .meta b { font-family: var(--mincho); font-size: 17px; color: var(--moon); font-weight: 600; }

  .reads { display: grid; gap: 14px; margin-top: 26px; }
  .read { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 18px 22px 20px; }
  .read b { display: block; font-family: var(--mincho); font-size: 14px; color: var(--ink); letter-spacing: .16em; margin-bottom: 4px; }
  .read p { margin: 0; font-size: 14px; }
  .read.msg { background: var(--ink); border-color: var(--ink); border-left-color: var(--gold-hi); }
  .read.msg b { color: var(--gold-hi); }
  .read.msg p { color: var(--moon); font-family: var(--mincho); font-size: 16px; line-height: 2; }

  .others { margin-top: 10px; }
  .bar { display: grid; grid-template-columns: 9.5em 1fr 3em; align-items: center; gap: 12px; font-size: 13px; margin: 0 0 10px; }
  .bar .t { height: 6px; background: var(--line); }
  .bar .t i { display: block; height: 100%; background: var(--gold-hi); }
  .bar.top .t i { background: var(--ink); }
  .bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--faint); }
  .bar.top { color: var(--ink); font-weight: 700; }
  @media (max-width: 480px) { .bar { grid-template-columns: 9em 1fr 2.6em; font-size: 12px; gap: 8px; } }

  .acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 30px; }
  @media (max-width: 480px) { .acts { grid-template-columns: 1fr; } }
  .acts button, .acts a { display: block; text-align: center; padding: 14px 8px; font: 500 13.5px var(--gothic); letter-spacing: .12em; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; text-decoration: none; }
  .acts .x { background: var(--ink); color: var(--moon); }

  .note { font-size: 11.5px; color: var(--faint); text-align: center; margin: 40px 0 0; line-height: 1.8; }
  footer { text-align: center; font-size: 12px; color: var(--faint); margin-top: 60px; padding-top: 28px; border-top: 1px solid var(--line); line-height: 2; }
  footer a { color: var(--gold); }
</style>

<div class="wrap">

  <header>
    <div class="brand">ZENSE SHINDAN</div>
    <h1>前世診断</h1>
    <p class="lede">名前と生年月日、5つの質問から、あなたの前世を読み解きます。</p>
  </header>

  <form id="form" novalidate>
    <h2>あなたのこと<small>PROFILE</small></h2>
    <div class="fields">
      <label class="f">お名前（ニックネーム可）<input id="name" autocomplete="nickname" maxlength="30" placeholder="例：むらた"></label>
      <label class="f">生年月日<input id="birth" type="date" min="1900-01-01" max="2026-12-31"></label>
    </div>

    <h2>魂の記憶<small>QUESTIONS</small></h2>
    <div id="qs"></div>

    <button class="go" type="submit">前世を読み解く</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <div class="reading" id="reading" aria-live="polite">
    <div class="orb"></div>
    <p id="readingText">魂の記憶をたどっています…</p>
  </div>

  <section id="result" aria-live="polite"></section>

  <p class="note">※ 前世診断はお遊びです。同じ名前・生年月日・答えなら、何度やっても同じ前世が出ます。</p>

  <footer>
    <a href="/">← jiujitsu.co.jp トップへ</a>
    <br>© 2026 BUTTI ON LINE Inc.
  </footer>

</div>

<script>
(() => {
  // 質問ごとに4択。選んだ答えのタグが、前世ごとのタグと何個重なるかで決まる。
  const QUESTIONS = [
    { q: "ふと惹かれる景色は？", a: [["海と水平線", "海"], ["山と森", "山"], ["古い町並み", "町"], ["満天の星", "星"]] },
    { q: "いちばん落ち着く時間は？", a: [["夜明け", "朝"], ["昼下がり", "昼"], ["夕暮れ", "夕"], ["真夜中", "夜"]] },
    { q: "気づくと手が伸びているのは？", a: [["本や文字", "言葉"], ["道具や手仕事", "手"], ["体を動かすこと", "体"], ["おいしいもの", "食"]] },
    { q: "理由もなく苦手なのは？", a: [["高いところ", "高"], ["狭くて暗い場所", "闇"], ["深い水", "水"], ["大勢の人ごみ", "群"]] },
    { q: "人からよく言われるのは？", a: [["落ち着いてるね", "静"], ["面倒見がいいね", "世話"], ["負けず嫌いだね", "闘"], ["自由な人だね", "旅"]] },
  ];

  const LIVES = [
    { id: "heian", era: "平安時代", years: [950, 1150], place: "平安京", role: "宮仕えの歌詠み", names: ["小式部", "宰相の君", "少納言の君", "伊勢の君"],
      tags: ["町", "夜", "言葉", "群", "静"],
      story: "月の出る夜にだけ、筆が進んだ。宮中の几帳の陰で、誰にも言えない想いを三十一文字に畳んでいた。返歌を待つ数日のあいだ、あなたは息をひそめるように暮らしていた。",
      trait: "言いたいことほど遠回しになる。話すより、文章のほうが本音が出る。",
      karma: "待つだけで終わった恋がひとつある。今世は、自分から先に送る番。",
      msg: "既読を待たなくていい。言葉は、送った時点でもう役目を果たしている。" },
    { id: "sengoku", era: "戦国時代", years: [1540, 1600], place: "尾張国", role: "足軽大将", names: ["権兵衛", "弥助", "又左衛門", "源八"],
      tags: ["山", "朝", "体", "群", "闘"],
      story: "槍一本で出世した。勝ち戦の手柄よりも、負け戦で味方を一人でも多く連れ帰ったことを、生涯の誇りにしていた。",
      trait: "集団の中で、自然とまとめ役になる。引き際の判断が早い。",
      karma: "部下を一人、守りきれなかった。その悔いが、今の面倒見のよさになっている。",
      msg: "全員を救わなくていい。あなたが倒れないことが、いちばんの守りになる。" },
    { id: "hikyaku", era: "江戸時代", years: [1720, 1850], place: "江戸・日本橋", role: "飛脚", names: ["六助", "早太", "千吉", "宗八"],
      tags: ["町", "朝", "体", "群", "旅"],
      story: "江戸から大坂まで、手紙を抱えて走った。中身は知らない。けれど、届けた先で泣き崩れる人の姿を、何度も見てきた。",
      trait: "じっとしていると落ち着かない。用事はその日のうちに片づけたい。",
      karma: "一通だけ、届けられなかった手紙がある。",
      msg: "急がなくても、ちゃんと届く。たまには歩いて、道ばたの景色を見て。" },
    { id: "tempura", era: "江戸時代", years: [1780, 1860], place: "江戸・両国", role: "屋台の天ぷら職人", names: ["甚五郎", "長次", "留吉", "お美代"],
      tags: ["町", "夕", "食", "群", "世話"],
      story: "夕暮れの両国橋のたもとで、揚げたての天ぷらを串に刺して売った。腹を空かせた子どもには、いつも一本おまけをつけた。",
      trait: "人にご飯を食べさせると機嫌がいい。味見がやたらと正確。",
      karma: "店を継ぐ者がいないまま、暖簾を下ろした。",
      msg: "あなたの「おいしい」は人を生かす。自分の分も、ちゃんと食べて。" },
    { id: "ryukyu", era: "琉球王国", years: [1500, 1700], place: "那覇の港", role: "海人（うみんちゅ）", names: ["加那", "思亀", "真牛", "樽金"],
      tags: ["海", "昼", "食", "水", "世話"],
      story: "サバニ一艘で外海に出た。潮と風を読む勘は、誰にも負けなかった。ある嵐の日を境に、二度と深い海には出なくなった。",
      trait: "水の近くにいると呼吸が深くなる。でも、足のつかない水は少し怖い。",
      karma: "海に置いてきた約束がある。",
      msg: "怖さは、あなたが生き延びた証。恥じることはひとつもない。" },
    { id: "egypt", era: "古代エジプト", years: [-1400, -1150], place: "テーベ", role: "神殿の書記", names: ["セティ", "メリト", "ネフェルカ", "ホルエム"],
      tags: ["町", "昼", "言葉", "闇", "静"],
      story: "パピルスに、税の記録と神々への祈りを書き写す毎日。一文字の誤りも許されない仕事を、四十年続けた。",
      trait: "誤字がやたらと目につく。几帳面と言われるが、本人はそう思っていない。",
      karma: "人の言葉は山ほど写したのに、自分の言葉を一行も残さなかった。",

    { id: "venice", era: "ルネサンス期", years: [1450, 1550], place: "ヴェネツィア・ムラーノ島", role: "ガラス職人", names: ["マルコ", "ジョヴァンナ", "ルカ", "アンジェロ"],
      tags: ["海", "昼", "手", "高", "静"],
      story: "技を守るため、島から出ることを禁じられた職人だった。炉の前で、誰も見たことのない青を吹き出した。その技法は、あなたと一緒に島に眠っている。",

    { id: "silkroad", era: "唐代", years: [680, 820], place: "敦煌からサマルカンドへ", role: "隊商の通訳", names: ["アルスラン", "安延", "ナナイ", "石亀"],
      tags: ["星", "夕", "言葉", "群", "旅"],
      story: "五つの言葉を操り、砂漠をゆく隊商と隊商のあいだを取り持った。どの国の人間でもなく、どこへ行っても歓迎された。",
      trait: "初対面の人とすぐ打ち解ける。「地元」という感覚がうすい。",

      msg: "どこにいても、あなたが居場所になれる。それでも、帰る港をひとつ。" },
    { id: "scriptor", era: "中世ヨーロッパ", years: [780, 900], place: "アイルランドの修道院", role: "写本師", names: ["ブレンダン", "コルム", "エイダン", "ブリギッド"],
      tags: ["山", "夜", "言葉", "闇", "静"],
      story: "ろうそく一本の灯りで、聖書の頭文字に金の渦巻きを描いた。一冊に十年かかった。窓の外は、いつも雨だった。",

      karma: "外の世界を見ないまま、一生を終えた。",
      msg: "完成させなくても、外に出ていい。続きは帰ってきてからでいい。" },
    { id: "gladiator", era: "古代ローマ", years: [60, 200], place: "ローマ・コロッセウム", role: "剣闘士", names: ["マクシムス", "フラマ", "スピクルス", "カルプス"],

    { id: "jujutsu", era: "明治〜大正", years: [1880, 1925], place: "東京から、地球の裏側へ", role: "海を渡った柔術家", names: ["栄太郎", "茂", "三郎", "常次郎"],

      msg: "遠回りに見える道ほど、遠くまで届く。" },
    { id: "jomon", era: "縄文時代", years: [-3500, -2500], place: "三内丸山の集落", role: "土器づくり", names: ["ヒノテ", "ヒスイ", "クリモリ", "ツチノコエ"],

    { id: "viking", era: "ヴァイキング時代", years: [850, 1050], place: "ノルウェーのフィヨルド", role: "航海者", names: ["ビョルン", "ソルヴェイグ", "エイリーク", "ラグナ"],

      soul: SOULS[hash(base + "soul") % SOULS.length],
      times: 3 + (hash(base + "times") % 47),
      bond: pick(BONDS, hash(base + "bond")),
      treasure: pick(TREASURES, hash(base + "treasure")),
      color: pick(COLORS, hash(base + "color")),
      ranks: scored.slice(0, 4).map((r, i) => ({ l: r.l, pct: Math.min(99, Math.round(62 + (r.score / Math.max(max, 1)) * 35) - i) })),
    };
  }

  function render(name, r) {
    const l = r.life;
    const shareText = `わたしの前世は「${l.era}の${l.role}」でした。\n${l.place}で生きた${r.pname}。\n#前世診断`;
    const shareUrl = "https://jiujitsu.co.jp/zense/";
    result.innerHTML = `
      <div class="card">
        <p class="who">${esc(name)} さんの前世</p>
        <p class="era">${l.era}　${fmtYear(r.born)}　${l.place}</p>
        <p class="role">${l.role}</p>
        <p class="pname">名は「${r.pname}」</p>
        <p class="story">${l.story}</p>
        <div class="meta">
          <div><small>享年</small><b>${r.age}歳</b></div>
          <div><small>魂の年齢</small><b>${r.soul}</b></div>
          <div><small>転生回数</small><b>${r.times}回目</b></div>
          <div><small>魂の色</small><b><i class="sw" style="background:${r.color[1]}"></i>${r.color[0]}</b></div>
          <div class="wide"><small>前世の宝物</small><b>${r.treasure}</b></div>
        </div>
      </div>
      <div class="reads">
        <div class="read"><b>今世に残った癖</b><p>${l.trait}</p></div>
        <div class="read"><b>持ち越した課題</b><p>${l.karma}</p></div>
        <div class="read"><b>今世の縁</b><p>${r.bond}</p></div>
        <div class="read msg"><b>前世からの伝言</b><p>${l.msg}</p></div>
      </div>
      <h2>ほかに見えた前世<small>RESONANCE</small></h2>
      <div class="others">${r.ranks.map((x, i) => `
        <div class="bar${i === 0 ? " top" : ""}"><span>${x.l.role}</span><span class="t"><i style="width:${x.pct}%"></i></span><span class="n">${x.pct}%</span></div>`).join("")}
      </div>
      <div class="acts">
        <a class="x" href="https://x.com/intent/post?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}" target="_blank" rel="noopener">Xでシェア</a>
        <button type="button" id="copy">結果をコピー</button>
        <button type="button" id="again">もう一度</button>
      </div>`;
    document.getElementById("copy").onclick = async e => {
      try { await navigator.clipboard.writeText(`${shareText}\n${shareUrl}`); e.target.textContent = "コピーしました"; }
      catch { e.target.textContent = "コピーできませんでした"; }
    };
    document.getElementById("again").onclick = () => {
      result.classList.remove("on");
      form.style.display = "";
      form.scrollIntoView({ behavior: "smooth" });
    };
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const birth = document.getElementById("birth").value;
    const answers = QUESTIONS.map((_, i) => (form.querySelector(`input[name=q${i}]:checked`) || {}).value);
    if (!name) { err.textContent = "お名前を入れてください。"; return; }
    if (!birth) { err.textContent = "生年月日を入れてください。"; return; }
    const missing = answers.findIndex(a => !a);
    if (missing >= 0) { err.textContent = `質問${["一", "二", "三", "四", "五"][missing]}に答えてください。`; return; }
    err.textContent = "";

    const r = diagnose(name, birth, answers);
    form.style.display = "none";
    reading.classList.add("on");
    window.scrollTo({ top: 0, behavior: "smooth" });
    const text = document.getElementById("readingText");
    let i = 0;
    text.textContent = READING[0];
    const timer = setInterval(() => { i++; if (i < READING.length) text.textContent = READING[i]; }, 650);
    setTimeout(() => {
      clearInterval(timer);
      reading.classList.remove("on");
      render(name, r);
      result.classList.add("on");
      if (window.gtag) gtag("event", "zense_result", { life: r.life.id });
    }, 2600);
  });
})();
</script>
