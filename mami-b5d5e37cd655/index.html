<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="まみ売上">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B4%3C/text%3E%3C/svg%3E">
<title>まみちゃん売上ノート</title>
<style>
:root{
  --bg:#FBF6F4; --card:#FFFFFF; --ink:#2A2024; --muted:#8C7D82; --line:#EEE3E1;
  --rose:#C2587A; --rose-soft:#F8E6EC; --gold:#A8842E; --gold-soft:#F4ECDA;
  --danger:#B3402F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1618; --card:#262023; --ink:#F3ECEE; --muted:#A8989E; --line:#3A3035;
    --rose:#E58AA8; --rose-soft:#3A2830; --gold:#D8B460; --gold-soft:#3A3222;
    --danger:#E88570;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1618; --card:#262023; --ink:#F3ECEE; --muted:#A8989E; --line:#3A3035;
  --rose:#E58AA8; --rose-soft:#3A2830; --gold:#D8B460; --gold-soft:#3A3222;
  --danger:#E88570;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

header.top{padding:calc(18px + env(safe-area-inset-top)) 0 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-size:11px;letter-spacing:.2em;color:var(--rose);font-weight:700}
h1{font-size:22px;margin:0;font-weight:800}
.lockbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

.month{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.month button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.month button:disabled{opacity:.3}
.month .label{font-size:18px;font-weight:800;text-align:center}
.month .label small{display:block;font-size:11px;font-weight:600;color:var(--muted)}

.total{background:linear-gradient(135deg,var(--rose-soft),var(--gold-soft));border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.total .k{font-size:12px;color:var(--muted);font-weight:700}
.total .v{font-size:38px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.total .v span{font-size:18px;margin-left:2px}
.total .row{display:flex;gap:18px;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.total .row b{color:var(--ink);font-size:15px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;font-weight:800}
.card h2 .r{float:right}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 4px}
.in{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);outline:none}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.6}
.in:focus{border-color:var(--rose)}
.amount{position:relative}
.amount .in{font-size:24px;font-weight:800;padding-left:32px}
.amount::before{content:"¥";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:800;color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.names{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.names button{border:none;background:var(--rose-soft);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.hint{font-size:12.5px;color:var(--rose);font-weight:700;margin-top:6px;min-height:1em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;height:54px;margin-top:16px;border:none;border-radius:14px;background:var(--rose);color:#fff;font-size:17px;font-weight:800;cursor:pointer}
.primary:active{transform:scale(.99)}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}

.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;padding:12px 2px 6px;border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item .who{flex:1;min-width:0}
.item .who b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .who small{color:var(--muted);font-size:12px}
.item .amt{font-weight:800;font-size:16px;text-align:right}
.empty{color:var(--muted);text-align:center;padding:22px 0;font-size:14px}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:8px 0;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tools{display:flex;gap:8px;margin-bottom:6px}
.tools .in{height:42px}
.tools select.in{width:auto;flex:none}

.rank{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.rank .n{width:22px;font-weight:800;color:var(--gold);text-align:center}
.rank .nm{width:30%;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .bar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--rose);border-radius:5px}
.rank .v{font-size:13px;font-weight:700;min-width:84px;text-align:right}
.sub2{color:var(--muted);font-weight:400;font-size:11.5px}

.hist{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.hist .m{width:78px;font-weight:700}
.hist .bar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.hist .bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.hist .v{min-width:96px;text-align:right;font-weight:800}
.hist small{color:var(--muted);font-weight:400;font-size:11px;display:block;text-align:right}
.yearsum{display:flex;justify-content:space-between;font-weight:800;padding:14px 2px 4px;font-size:15px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;height:62px;border:none;background:none;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
nav.tabs button span{display:block;font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--rose)}

.note{font-size:12.5px;color:var(--muted);line-height:1.7}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts button{flex:1;height:48px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.del{background:none;border:1px solid var(--danger);color:var(--danger)}
.save{background:var(--rose);border:none;color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 4px}
.stats div{background:var(--bg);border-radius:12px;padding:9px 10px}
.stats small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.stats b{font-size:15px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.show{opacity:1}

/* ロック画面 */
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
#lock .ttl{font-size:13px;letter-spacing:.2em;color:var(--rose);font-weight:700}
#lock h2{font-size:20px;margin:6px 0 4px;font-weight:800;text-align:center}
#lock .msg{font-size:13px;color:var(--muted);min-height:1.5em;text-align:center;max-width:300px}
#lock .msg.err{color:var(--danger);font-weight:700}
.dots{display:flex;gap:14px;margin:22px 0 26px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rose)}
.dots i.f{background:var(--rose)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:28px;font-weight:600;cursor:pointer}
.pad button:active{background:var(--rose-soft)}
.pad button.nb{border:none;background:none;font-size:15px;font-weight:700;color:var(--muted)}
.pad button:disabled{opacity:.35}
#forgot{margin-top:22px;background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer}
</style>

<!-- ロック画面 -->
<div id="lock">
  <div class="ttl">MAMI'S SALES NOTE</div>
  <h2 id="lk-title">暗証番号</h2>
  <div class="msg" id="lk-msg"></div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <button id="forgot" hidden>暗証番号を忘れたとき</button>
</div>

<div id="app" hidden>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">MAMI'S SALES NOTE</div>
      <h1>まみちゃん売上ノート</h1>
    </div>
    <button class="lockbtn" id="lockNow">🔒 ロック</button>
  </header>

  <div class="month">
    <button id="prev" aria-label="前の月">‹</button>
    <div class="label"><span id="mlabel"></span><small id="msub"></small></div>
    <button id="next" aria-label="次の月">›</button>
  </div>

  <div class="total">
    <div class="k" id="tk">今月の売上</div>
    <div class="v num" id="tv">0<span>円</span></div>
    <div class="row">
      <div>件数 <b class="num" id="tc">0</b></div>
      <div>お客さま <b class="num" id="tp">0</b>人</div>
      <div>今日 <b class="num" id="tt">0</b>円</div>
    </div>
  </div>

  <section id="s-add">
    <div class="card">
      <h2>売上を記録する</h2>
      <form id="addf" autocomplete="off">
        <div class="two">
          <div>
            <label class="f" for="d">日付</label>

        <div class="hint" id="whohint"></div>
        <div class="names" id="recent"></div>
        <label class="f" for="amt">金額</label>
        <div class="amount"><input class="in num" id="amt" inputmode="numeric" placeholder="0" autocomplete="off"></div>
        <div class="quick" id="quick"></div>
        <button class="primary" type="submit">記録する</button>
      </form>
    </div>
  </section>

  <section id="s-list" hidden>
    <div class="card"><h2>この月の記録</h2><div id="list"></div></div>
  </section>

  <section id="s-cust" hidden>
    <div class="card">
      <div class="seg" id="cseg">
        <button data-v="book" class="on">お客さま名簿</button>
        <button data-v="rank">この月のランキング</button>

      <div id="c-book">
        <div class="tools">
          <input class="in" id="csearch" placeholder="名前・メモで探す" autocomplete="off">
          <select class="in" id="csort">
            <option value="recent">最近来た順</option>
            <option value="total">売上が多い順</option>
            <option value="count">回数が多い順</option>
            <option value="away">ご無沙汰順</option>
            <option value="name">名前順</option>
          </select>
        </div>
        <div id="book"></div>
        <div class="btnrow"><button class="ghost" id="newCust">＋ お客さまを登録</button></div>
      </div>
      <div id="c-rank" hidden><div id="rank"></div></div>
    </div>
  </section>

  <section id="s-hist" hidden>
    <div class="card"><h2>月ごとの売上</h2><div id="hist"></div></div>
    <div class="card">
      <h2>バックアップ</h2>
      <p class="note">記録はこのスマホの中だけに、暗証番号で鍵をかけて保存しています。機種変更などで消えないよう、月に1回くらい「バックアップを保存」してください。バックアップも暗証番号で鍵がかかっているので、LINEの自分宛てトークなどに置いても中身は読まれません。</p>
      <div class="btnrow">
        <button class="ghost" id="bk">バックアップを保存</button>
        <button class="ghost" id="rs">バックアップから戻す</button>
        <button class="ghost" id="csv">Excel用（CSV）</button>
        <input type="file" id="rsf" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="card">
      <h2>セキュリティ</h2>
      <p class="note">アプリを閉じたり別のアプリに切り替えて1分たつと、自動でロックされます。</p>
      <div class="btnrow"><button class="ghost" id="chpin">暗証番号を変える</button></div>
    </div>

</div>

<nav class="tabs">
  <button data-t="add" class="on"><span>✏️</span>入力</button>
  <button data-t="list"><span>📋</span>一覧</button>
  <button data-t="cust"><span>👑</span>お客さま</button>

</nav>
</div>

  <div class="sheet">
    <div class="shead">

      <button class="ghost" id="crename">名前を変える</button>

</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const STORE = 'mami-sales-v2';     // 暗号化したデータ
  const OLD = 'mami-sales-v1';       // 暗号化前の古いデータ（見つけたら取りこんで消す）
  const FAILS = 'mami-sales-fails';
  const PIN_LEN = 6;
  const ITER = 310000;
  const LOCK_AFTER = 60 * 1000;

  const $ = id => document.getElementById(id);
  const yen = n => n.toLocaleString('ja-JP');
  const pad2 = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const today = () => ymd(new Date());
  const WD = ['日','月','火','水','木','金','土'];
  const md = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}`; };
  const daysAgo = s => Math.round((new Date(today() + 'T00:00:00') - new Date(s + 'T00:00:00')) / 864e5);
  const agoText = s => { const n = daysAgo(s); return n <= 0 ? '今日' : n === 1 ? '昨日' : `${n}日前`; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const san = n => /(さん|様|さま|ちゃん|くん|君|氏)$/.test(n) ? n : n + 'さん';
  const parseAmt = s => { const n = parseInt(String(s).replace(/[^\d]/g, ''), 10); return isNaN(n) ? 0 : n; };
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ---------- 暗号化（PBKDF2 → AES-GCM） ----------
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = u8 => btoa(String.fromCharCode(...u8));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pin, salt, iter) {
    const base = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function seal(obj, key, salt, iter) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj))));
    return { app: 'mami-sales', v: 2, it: iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
  }
  async function open(box, key) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct));
    return JSON.parse(td.decode(pt));
  }

  // ---------- 状態 ----------
  let S = null;              // { sales: [], cust: { 名前: {note, bday} } }
  let session = null;        // { key, salt, iter, pin }
  let writing = Promise.resolve();

  function normalize(o) {
    const sales = Array.isArray(o) ? o : (o && Array.isArray(o.sales) ? o.sales : []);
    const cust = (o && !Array.isArray(o) && o.cust && typeof o.cust === 'object') ? o.cust : {};
    return { sales: sales.filter(r => r && r.id && r.date && r.who && typeof r.amount === 'number'), cust };
  }
  function save() {
    if (!session) return;
    const snap = JSON.parse(JSON.stringify(S)), sess = session;
    writing = writing.then(async () => {
      const box = await seal(snap, sess.key, sess.salt, sess.iter);
      if (!ls.set(STORE, JSON.stringify(box))) alert('保存できませんでした。プライベートブラウズになっていないか確認してください。');
    });
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- ロック画面 ----------
  let entry = '', mode = 'unlock', firstPin = '', busy = false;
  const stored = () => { try { return JSON.parse(ls.get(STORE) || 'null'); } catch (e) { return null; } };

  function drawDots() {
    $('dots').innerHTML = Array.from({ length: PIN_LEN }, (_, i) => `<i class="${i < entry.length ? 'f' : ''}"></i>`).join('');
  }
  function lockMsg(t, err) { $('lk-msg').textContent = t || ''; $('lk-msg').classList.toggle('err', !!err); }
  function shake() { const d = $('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
  function setMode(m) {
    mode = m; entry = ''; drawDots();
    const titles = { unlock: '暗証番号を入れてください', setup: '暗証番号を決めてください', confirm: 'もう一度入れてください', newpin: '新しい暗証番号', newconfirm: 'もう一度入れてください', oldpin: 'いまの暗証番号' };
    $('lk-title').textContent = titles[m];
    $('forgot').hidden = m !== 'unlock';
    if (m === 'setup') lockMsg(`数字${PIN_LEN}桁。忘れると記録を開けなくなるので、メモしておいてください。`);
    else if (m === 'unlock') lockMsg('');
  }
  (function buildPad() {
    const keys = ['1','2','3','4','5','6','7','8','9','cancel','0','del'];
    $('pad').innerHTML = keys.map(k => k === 'del' ? '<button class="nb" data-k="del" aria-label="1文字消す">消す</button>'
      : k === 'cancel' ? '<button class="nb" data-k="cancel" id="padCancel">やめる</button>'
      : `<button data-k="${k}">${k}</button>`).join('');
    $('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
    document.addEventListener('keydown', e => {
      if ($('lock').hidden) return;
      if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del');
    });
  })();
  function refreshCancel() { $('padCancel').style.visibility = (mode === 'oldpin' || mode === 'newpin' || mode === 'newconfirm') ? 'visible' : 'hidden'; }

  function waitLeft() {
    try { const f = JSON.parse(ls.get(FAILS) || '{}'); return Math.max(0, (f.until || 0) - Date.now()); } catch (e) { return 0; }
  }
  function addFail() {
    let f; try { f = JSON.parse(ls.get(FAILS) || '{}'); } catch (e) { f = {}; }
    f.n = (f.n || 0) + 1;
    if (f.n >= 5) f.until = Date.now() + Math.min(30 * 60e3, 30e3 * Math.pow(2, f.n - 5));
    ls.set(FAILS, JSON.stringify(f));
    return f.n;
  }

  async function press(k) {
    if (busy) return;
    if (k === 'cancel') { showApp(); return; }
    if (k === 'del') { entry = entry.slice(0, -1); drawDots(); return; }
    if (entry.length >= PIN_LEN) return;
    entry += k; drawDots();
    if (entry.length < PIN_LEN) return;
    const pin = entry;
    busy = true;
    try { await submit(pin); } finally { busy = false; }
  }

  async function submit(pin) {
    if (mode === 'setup' || mode === 'newpin') {
      firstPin = pin; setMode(mode === 'setup' ? 'confirm' : 'newconfirm'); refreshCancel(); return;
    }
    if (mode === 'confirm' || mode === 'newconfirm') {
      if (pin !== firstPin) { shake(); setMode(mode === 'confirm' ? 'setup' : 'newpin'); lockMsg('番号がちがいました。最初からもう一度。', true); refreshCancel(); return; }
      lockMsg('鍵をかけています…');
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(pin, salt, ITER);
      if (mode === 'confirm') {
        let old = null; try { old = JSON.parse(ls.get(OLD) || 'null'); } catch (e) {}
        S = normalize(old || []);
      }
      session = { key, salt, iter: ITER, pin };
      save(); await writing;
      ls.del(OLD);
      const changed = mode === 'newconfirm';
      showApp(); if (changed) toast('暗証番号を変えました');
      return;
    }
    if (mode === 'oldpin') {
      if (pin !== session.pin) { shake(); entry = ''; drawDots(); lockMsg('番号がちがいます', true); return; }
      setMode('newpin'); refreshCancel(); return;
    }
    // unlock
    const wait = waitLeft();
    if (wait) { shake(); entry = ''; drawDots(); lockMsg(`まちがいが続いたので、${Math.ceil(wait / 1000)}秒待ってください`, true); return; }
    lockMsg('開いています…');
    const box = stored();
    try {
      const salt = unb64(box.salt), iter = box.it || ITER;
      const key = await deriveKey(pin, salt, iter);
      S = normalize(await open(box, key));
      session = { key, salt, iter, pin };
      ls.del(FAILS);
      showApp();
    } catch (e) {
      const n = addFail();
      shake(); entry = ''; drawDots();
      lockMsg(n >= 5 ? `番号がちがいます（${n}回目）。しばらく待ってから入れてください` : '番号がちがいます', true);
    }
  }

    if (prompt('本当に消すときは「けす」と入れてください') !== 'けす') return;

  function render() {

    }).join('') : '<div class="empty">この月の記録はまだありません</div>';

    const pr = [...per.entries()].sort((a, b) => b[1].s - a[1].s);

    const ks = [...months.keys()].sort().reverse();
    const hmax = Math.max(1, ...[...months.values()].map(v => v.s));
    let html = '', year = null, ysum = 0;
    const flush = () => { if (year) html += `<div class="yearsum"><span>${year}年 合計</span><span class="num">${yen(ysum)}円</span></div>`; };
    ks.forEach(k => {
      const [y, m] = k.split('-');
      if (y !== year) { flush(); year = y; ysum = 0; }
      const v = months.get(k); ysum += v.s;
      html += `<div class="hist" data-k="${k}"><div class="m">${y}/${+m}月</div><div class="bar"><i style="width:${Math.max(2, v.s / hmax * 100)}%"></i></div><div class="v num">${yen(v.s)}円<small>${v.n}件</small></div></div>`;
    });
    flush();
    $('hist').innerHTML = html || '<div class="empty">まだ記録がありません</div>';
  }

  function renderBook(cs) {
    cs = cs || customerStats();
    const q = $('csearch').value.trim().toLowerCase();

  $('csv').onclick = () => {
    if (!confirm('Excel用のファイルは鍵がかかっていません。お客さまの名前がそのまま読めるので、人に送ったり置きっぱなしにしないでください。\n\n書き出しますか？')) return;
    const q = s => `"${String(s).replace(/"/g, '""').replace(/^([=+\-@])/, "'$1")}"`;
    const lines = ['日付,お客さま,金額,メモ', ...[...S.sales].sort((a, b) => a.date.localeCompare(b.date) || a.t - b.t).map(r => [r.date, q(r.who), r.amount, q(r.memo || '')].join(','))];
    download(`まみ売上_${today()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
  };
  $('rs').onclick = () => $('rsf').click();
  $('rsf').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    let incoming;
    try {
      const j = JSON.parse(await f.text());
      if (j && j.v === 2 && j.ct) {
        try { incoming = await open(j, await deriveKey(session.pin, unb64(j.salt), j.it || ITER)); }
        catch (err) {
          const p = prompt('このバックアップを作ったときの暗証番号（6桁）を入れてください');
          if (!p) return;
          incoming = await open(j, await deriveKey(p, unb64(j.salt), j.it || ITER));
        }
      } else incoming = j && j.data ? j.data : j;   // 鍵なしの古いバックアップ
      incoming = normalize(incoming);
    } catch (err) { alert('このファイルは読み込めませんでした（暗証番号がちがうか、ファイルがこわれています）'); return; }
    const ids = new Set(S.sales.map(r => r.id));
    const add = incoming.sales.filter(r => !ids.has(r.id));
    if (!confirm(`${incoming.sales.length}件のうち、まだ入っていない${add.length}件を追加します。よろしいですか？`)) return;
    S.sales = S.sales.concat(add);
    for (const [n, v] of Object.entries(incoming.cust)) {
      const mine = S.cust[n];
      if (!mine) S.cust[n] = v;
      else S.cust[n] = { note: mine.note || v.note || '', bday: mine.bday || v.bday || '' };
    }
    save(); render(); toast(`${add.length}件を戻しました`);
  };

  // ---------- はじめに ----------
  if (!window.crypto || !crypto.subtle) {
    $('lk-title').textContent = 'このブラウザでは使えません';
    lockMsg('Safari か Chrome の新しいもので開いてください。', true);
    $('pad').hidden = true;
  } else {
    lock();
  }
})();
</script>
</html>
