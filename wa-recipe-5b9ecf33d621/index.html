<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>和食レシピ帖</title>
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
/* 携帯で片手：表紙→レシピ帖の案内→検索と絞り込み→写真2列のカード。料理をタップすると全面でレシピ */
:root{
  --bg:#FDF6F7; --card:#FFFFFF; --ink:#3B2A31; --sub:#8A6F77; --pink:#C4577A; --rose:#E9A3B6; --pale:#F8E1E7; --line:#F0D6DE; --leaf:#7FA37A; --chipfg:#FFFFFF;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-hand:"Klee One","Zen Maru Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1F171A;--card:#2A2024;--ink:#F5E8EC;--sub:#C4A8B1;--pink:#EE93AF;--rose:#B9677F;--pale:#3A2A30;--line:#45333B;--leaf:#9CC296;--chipfg:#1F171A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F171A;--card:#2A2024;--ink:#F5E8EC;--sub:#C4A8B1;--pink:#EE93AF;--rose:#B9677F;--pale:#3A2A30;--line:#45333B;--leaf:#9CC296;--chipfg:#1F171A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* 表紙 */
.cover{position:relative;text-align:center;padding-block:34px 22px;overflow:hidden}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cover .eyebrow{font-family:var(--f-hand);color:var(--pink);font-size:14px;letter-spacing:.12em;position:relative}
.cover h1{position:relative;font-family:var(--f-display);font-size:32px;letter-spacing:.14em;margin:6px 0 4px;text-wrap:balance}
.cover p{position:relative;margin:0;color:var(--sub);font-size:13px}
.cover .n{font-family:var(--f-display);color:var(--pink);font-size:18px;font-variant-numeric:tabular-nums}

/* レシピ帖の案内 */
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.book{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;border:1px solid var(--line)}
.book .s{font-family:var(--f-display);font-size:16px}
.book .c{font-size:11px;color:var(--sub)}
.book .p{font-family:var(--f-display);color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.year{margin-top:8px;border-radius:20px;padding:14px 16px;background:var(--pale);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.year .l{flex:1;min-width:0}
.year b{font-family:var(--f-display);font-size:18px;display:block}
.year small{color:var(--sub);font-size:12px;display:block}
.year .r{text-align:right}
.year s{color:var(--sub);font-size:13px}
.year .p{font-family:var(--f-display);color:var(--pink);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-family:var(--f-hand);font-size:12px;background:var(--pink);color:var(--chipfg);border-radius:999px;padding:1px 10px;margin-bottom:2px}
.demo{margin-top:10px;font-size:12px;color:var(--sub);text-align:center}

/* 検索と絞り込み */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 6px;margin-top:14px}
#q{width:100%;font:inherit;font-size:16px;padding:11px 18px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);outline:none}
#q:focus-visible{border-color:var(--pink);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rose);color:var(--pink);background:var(--card);border-radius:999px;padding:3px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--chipfg)}
.ings .chip{border-color:var(--line);color:var(--ink);background:var(--card)}
.ingl{flex:none;font-size:12px;color:var(--sub);align-self:center}
.seasons .chip{border-color:var(--line);color:var(--sub)}
.seasons .chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--chipfg)}
.count{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

/* 一覧 */
section{margin-top:22px}
h2{font-family:var(--f-display);font-size:19px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2::before{content:"✿";color:var(--rose);font-size:14px}
h2 small{font-family:var(--f-body);font-size:12px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;height:100%;background:var(--card);border:0;border-radius:20px;padding:8px 8px 10px;text-align:left;cursor:pointer;width:100%}
.ph{position:relative;display:block;aspect-ratio:1/1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--pale)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--rose);font-size:28px}
.tagfree,.taglock{position:absolute;top:6px;left:6px;font-family:var(--f-hand);font-size:11px;border-radius:999px;padding:0 8px}
.tagfree{background:var(--pink);color:var(--chipfg)}
.taglock{background:var(--card);color:var(--sub)}
.item .t{display:block;font-family:var(--f-display);font-size:14px;line-height:1.45;margin:8px 4px 2px;overflow-wrap:anywhere}
.item .m{display:block;font-size:11px;color:var(--sub);margin:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--sub);text-align:center;padding:40px 0}
mark{background:var(--pale);color:inherit;border-radius:3px}

/* レシピを開いたとき */
#detail{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.dbar{position:sticky;top:0;z-index:1;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:14px}
.dbar .count{margin-left:auto}
.dbody{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:4px calc(env(safe-area-inset-bottom,0px) + 48px)}
.dbody .photo{width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px;display:block}
.dbody h2{font-size:22px;margin-top:16px;line-height:1.45;display:block}
.dbody h2::before{content:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.tag{font-size:12px;background:var(--pale);color:var(--sub);border-radius:999px;padding:1px 10px}
.yield{font-size:13px;color:var(--sub)}
h3{font-family:var(--f-display);font-size:17px;color:var(--pink);margin:22px 0 6px;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
h4{font-size:13px;margin:10px 0 2px;color:var(--sub);font-weight:700}
.ing{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;padding:4px 14px}
.ing{max-width:520px}
.ing li{display:flex;align-items:baseline;gap:6px;padding:6px 0}
.ing li span:first-child{min-width:0}
.ing li i{flex:1 1 12px;min-width:12px;border-bottom:2px dotted var(--rose);opacity:.7;transform:translateY(-4px)}
.ing li span:last-child{text-align:right;color:var(--ink);flex:0 1 auto;max-width:60%;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s var(--start,0)}
ol.steps li{position:relative;padding:6px 0 6px 38px;counter-increment:s}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--pale);color:var(--pink);font-weight:700;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tips{background:var(--card);border-radius:16px;padding:10px 14px;font-family:var(--f-hand);font-size:14px}
.tips ul{margin:0;padding-left:1.2em}
.src{font-size:11px;color:var(--sub);margin-top:18px}
.pay{margin-top:16px;background:var(--card);border:1.5px dashed var(--rose);border-radius:22px;padding:18px 16px;text-align:center}
.pay>b{font-family:var(--f-display);font-size:18px;display:block}
.pay .sub{font-size:12px;color:var(--sub)}
.plans{display:grid;gap:6px;margin:12px 0;text-align:left}
.plans div{display:flex;align-items:baseline;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:5px}
.plans span:first-child{flex:1;min-width:0}
.plans .c{font-size:12px;color:var(--sub)}
.plans .p{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.plans .best span:first-child{font-weight:700;color:var(--pink)}
.plans .best .p{color:var(--pink)}
.plans s{font-size:12px;color:var(--sub)}
.pay button{margin-top:8px;border:0;background:var(--pink);color:var(--chipfg);font-weight:700;border-radius:999px;padding:11px 24px;cursor:not-allowed}
.pay small{display:block;color:var(--sub);margin-top:6px;font-size:11px}
.doc{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer}
.doc .ic{flex:none;font-size:22px}
.doc b{display:block;font-family:var(--f-display);font-size:15px}
.doc small{display:block;color:var(--sub);font-size:12px;line-height:1.5}
.readcard{display:flex;gap:12px;align-items:center;width:100%;margin-top:18px;background:var(--pale);border:0;border-radius:20px;padding:14px 16px;text-align:left;cursor:pointer}
.readcard .ic{flex:none;width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-display);color:var(--pink);font-size:15px}
.readcard b{display:block;font-family:var(--f-display);font-size:16px}
.readcard small{display:block;color:var(--sub);font-size:12px;line-height:1.5}
.golink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1.5px solid var(--rose);background:var(--card);color:var(--pink);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:14px}
.article .lead{color:var(--sub);font-size:13px}
.article h3{margin-top:26px}
.article p{margin:8px 0}
.article ul{padding-left:1.3em;margin:6px 0}
.article h5{font-size:14px;margin:12px 0 2px}
.article .hand{font-family:var(--f-hand);color:var(--pink)}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tbl th{background:var(--pale)}
.keybar{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.keybtn{border:1.5px solid var(--pink);background:var(--card);color:var(--pink);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:14px}
.owned{font-family:var(--f-hand);color:var(--leaf)}
#unlock{position:fixed;inset:0;z-index:20;background:rgba(40,20,28,.45);display:grid;place-items:center;padding:16px}
#unlock .box{width:100%;max-width:420px;background:var(--bg);border-radius:24px;padding:22px 18px;text-align:center}
#unlock b{font-family:var(--f-display);font-size:18px;display:block}
#unlock p{font-size:13px;color:var(--sub);margin:6px 0 12px}
#pass{width:100%;font:inherit;font-size:17px;padding:11px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-align:center}
#unlock .row{display:flex;gap:8px;margin-top:12px}
#unlock .row button{flex:1;border-radius:999px;padding:10px;font-weight:700;cursor:pointer;border:0}
#go{background:var(--pink);color:var(--chipfg)}
#cancel{background:var(--pale);color:var(--ink)}
#msg{min-height:1.6em;font-size:13px;margin-top:10px}
#msg.ok{color:var(--leaf)} #msg.ng{color:var(--pink)}
.tagopen{position:absolute;top:6px;left:6px;font-family:var(--f-hand);font-size:11px;border-radius:999px;padding:0 8px;background:var(--leaf);color:var(--chipfg)}
.haskey{margin-top:10px;border:0;background:transparent;color:var(--pink);text-decoration:underline;cursor:pointer;font-size:13px}
@media (prefers-reduced-motion:no-preference){#detail{animation:up .2s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<div class="wrap">
  <div class="cover">
    <canvas id="petals" aria-hidden="true"></canvas>
    <div class="eyebrow">お教室のレシピを、いつでも</div>
    <h1>和食レシピ帖</h1>
    <p>季節の和食 <span class="n" id="total"></span> 品・写真と手書きのコツつき</p>
  </div>
  <div id="shop" hidden>
    <div class="year"><div class="l"><span class="badge">会員</span><b>全部のレシピが読み放題</b><small>いまある<span id="nall"></span>品＋毎月5品ずつ新しいレシピが増えます<br>いつでも解約できます</small></div>
      <div class="r"><div class="p">月680円</div><small>税込</small></div></div>
    <p class="demo" id="demo"></p>
    <div class="keybar"><button class="keybtn" id="keybtn" type="button">🔑 会員の合言葉を入れる</button><span class="owned" id="owned"></span></div>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="今日は何を作ろう？ 材料や料理名で（例：人参 豚肉）" autocomplete="off">
    <div class="chips" id="genres" role="group" aria-label="ジャンル"></div>
    <div class="chips seasons" id="seasons" role="group" aria-label="季節"></div>
    <div class="chips ings" id="ings" role="group" aria-label="材料から探す"></div>
    <span class="count" id="count"></span>
  </div>
  <main id="list"></main>
</div>
<div id="detail" hidden></div>
<div id="unlock" hidden><div class="box" role="dialog" aria-labelledby="ul-t"><b id="ul-t">会員の合言葉を入れる</b><p>会員の方にメールでお送りしている合言葉を入れると、全部のレシピが読めるようになります。合言葉は毎月新しくなります。</p>
<input id="pass" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例：かいいん-さくら-1234"><div id="msg"></div>
<div class="row"><button id="cancel" type="button">閉じる</button><button id="go" type="button">読めるようにする</button></div></div></div>
<script>
const R = [{"id":"r0001","title":"卵豆腐と豚しゃぶ、モロヘイヤのすり流し","yield":"流し缶（140mm×109mm）に高さ1cmほどで6個分。お好きな型・容器でお好きな量","photo":"p/p03_01.jpg","tags":{"ingredients":["卵","豚肉","モロヘイヤ","らっきょう"],"season":["夏"],"category":["冷菜"]},"ingredients":[{"group":"卵豆腐","items":[{"name":"卵","amount":"2個"},{"name":"出汁","amount":"卵の重量の1.4〜1.5倍量（M玉は大体50〜55gなので、はかるのが面倒だったら150cc）"},{"name":"薄口醤油","amount":"小さじ1"},{"name":"みりん","amount":"小さじ1"},{"name":"塩","amount":"ひとつまみ"}]},{"group":"モロヘイヤのすり流し（3皿分）","items":[{"name":"モロヘイヤ","amount":"4〜5本"},{"name":"出汁","amount":"100cc"},{"name":"薄口醤油","amount":"小さじ1"},{"name":"塩","amount":"ひとつまみ"}]},{"group":"そのほか","items":[{"name":"豚肉（お好みの部位の薄切り）","amount":"適量"},{"name":"らっきょう","amount":"適量"},{"name":"日本酒","amount":"少々"}]}],"steps":[{"group":"卵豆腐","items":["卵の重量をはかり、1.4〜1.5倍量の出汁を用意する。","卵を泡立てないよう、白身を切るようによく混ぜる。出汁と調味料を合わせて混ぜる。","濾しながら容器に入れる。泡が立っていたらチャッカマンで消すか、スプーンで除く。（時間をおけば自然にも消えます。）","蒸し器をセットして、沸いたら弱火にして蓋をして10〜15分蒸す。（蓋に布巾を巻き、少しずらしておくと、すが立ちにくい）","粗熱をとって冷蔵庫で冷やす。"]},{"group":"豚しゃぶ","items":["水に日本酒をちょろっと入れて沸かす。沸いたら火を弱め、豚肉を広げて入れる。薄いピンクになったらざるにあげ、そのまま冷ます。","らっきょうはみじん切りにする。"]},{"group":"すり流し","items":["モロヘイヤは茎と葉に分ける。お湯を沸かして塩を入れ、茎を入れて30秒したら葉を入れ、冷水にあげる。","出汁、塩、薄口醤油と一緒にブレンダーにかける。冷やしておく。"]},{"group":"盛りつけ","items":["器にすり流しを入れ、切った豚しゃぶを広げて、上に卵豆腐を乗せる。刻んだらっきょうを乗せる。"]}],"tips":[],"y":"たまごとうふとぶたしゃぶ、もろへいやのすりながし たまご ぶたにく もろへいや らっきょう たまご だし うすくちしょうゆ みりん しお もろへいや だし うすくちしょうゆ しお ぶたにく(おこのみのぶいのうすぎり) らっきょう にっぽんしゅ"},{"id":"r0002","title":"鮑水貝","yield":"鮑2個分","photo":"p/p06_01.jpg","tags":{"ingredients":["鮑","胡瓜","酢橘","じゅんさい"],"season":["夏"],"category":["冷菜"]},"ingredients":[{"group":"","items":[{"name":"鮑","amount":"2個"},{"name":"胡瓜","amount":"1/2本"},{"name":"酢橘","amount":"2〜4枚"},{"name":"じゅんさい","amount":"あれば"},{"name":"牡蠣醤油","amount":"適量"}]},{"group":"☆","items":[{"name":"水","amount":"100cc"},{"name":"塩","amount":"3g"},{"name":"昆布","amount":"3g"}]}],"steps":[{"group":"","items":["☆を火にかけ、軽く温まり塩が溶けたら火を止めて冷ます。冷蔵庫に入れる。","蛇腹胡瓜を作り、塩もみする。（斜めに細かく切り込みを入れ、ひっくり返して同じように切り込みを入れる。）","鮑は殻が薄い方からテーブルナイフ等を入れ、殻に沿ってこそげながら身をはずす。","紐と肝を外す。肝の砂袋のあたりを切り落として洗う。紐は塩で揉んで洗う。紐と肝を1分ほど茹でて冷水で冷ます。（肝は生でも食べられますが、お教室では加熱します）","口を取り除く。塩を全面につけて、丸めたホイルなどでこすり洗いをして流しておく。","貝柱を削ぐ。周りの身を外す。中心の身はサイコロ状に波切りにする。","器に氷を入れて1を入れ、身・貝柱・紐、胡瓜・酢橘・じゅんさいを浮かべる。","叩いた肝と牡蠣醤油を混ぜて、添える。"]}],"tips":[],"y":"あわびみずがい あわび きゅうり すだち じゅんさい あわび きゅうり すだち じゅんさい かきしょうゆ みず しお こんぶ"},{"id":"r0003","title":"柔らか蒸し鮑のセロリ柚子胡椒豆乳クリーム 青さ新馬鈴薯揚げ添え","yield":"小さめの鮑2個分","photo":"p/p05_01.jpg","tags":{"ingredients":["鮑","セロリ","豆乳","柚子胡椒","じゃがいも","青さ"],"season":["春","初夏"],"category":["温菜"]},"ingredients":[{"group":"","items":[{"name":"鮑（小さめ）","amount":"2個"},{"name":"酒","amount":"適量"},{"name":"セロリ","amount":"20g"},{"name":"玉ねぎ","amount":"20g"},{"name":"バター","amount":"8g"},{"name":"米粉","amount":"小さじ1"},{"name":"無調整豆乳","amount":"70g"},{"name":"柚子胡椒","amount":"小さじ1/4"},{"name":"昆布茶の素","amount":"小さじ1/8"},{"name":"砂糖","amount":"ひとつまみ"},{"name":"塩","amount":"ひとつまみ"},{"name":"新じゃがいも・片栗粉・青さ","amount":"適量"},{"name":"揚げ油","amount":"適量"}]}],"steps":[{"group":"","items":["鮑はたわしや丸めたアルミホイルで表面をこすり洗いする。最後に殻の部分もこすり洗いする。","蒸し器が沸騰したら火を極弱火にし、耐熱皿に入れた鮑に酒を振り入れて30分以上蒸す。（大きさによって追加します）","〈蒸している間に〉玉ねぎとセロリを極みじん切りにし、バターと共に小鍋に入れて塩ひとつまみをして、弱火で8〜10分ほどじっくり炒める。火を止めて米粉を入れて粉っぽさがなくなるまで混ぜ、火をつけて豆乳を少しずつ加えてクリーム状にする。調味料も入れる。火を止めておく。","〈蒸している間に〉新じゃがいもはなるべく細い千切りにして水にさらす。水分を拭いて片栗粉をまぶし、熱した油でカリッとなるまで揚げて（1分ほど）広げておく。","鮑を取り出し（煮汁は捨てない）、殻の薄い方からテーブルナイフなどで身を残さないようにこそげながら身を外す。","口、ひも、肝を取り外す。身を4〜5等分にする。殻に盛る。","肝は叩く。煮汁（大さじ1）と柚子胡椒と一緒に3に入れて温める。","身の上にかける。4を乗せて青さをかける。"]}],"tips":[],"y":"やわらかむしあわびのせろりゆずこしょうとうにゅうくりいむ あおさしんじゃがいもあげそえ あわび せろり とうにゅう ゆずこしょう じゃがいも あおさ あわび(ちいさめ) さけ せろり たまねぎ ばたあ こめこ むちょうせいとうにゅう ゆずこしょう こんぶちゃのもと さとう しお しんじゃがいも・かたくりこ・あおさ あげあぶら"},{"id":"r0004","title":"翡翠茄子","yield":null,"photo":"p/p01_01.jpg","tags":{"ingredients":["茄子","出汁","ナンプラー","米油"],"season":["夏"],"category":["冷菜"]},"ingredients":[{"group":"","items":[{"name":"茄子","amount":"2本"},{"name":"米油","amount":"適量"}]},{"group":"☆","items":[{"name":"出汁","amount":"120g"},{"name":"薄口醤油","amount":"小さじ2"},{"name":"みりん","amount":"小さじ2"},{"name":"ナンプラー","amount":"小さじ1（なければ薄口醤油で調整）"}]}],"steps":[{"group":"","items":["☆を一度煮立たせて冷やす。","茄子はヘタギリギリで一周切り込みを入れる。その後縦に皮目一枚ほどの切り込みを4〜5本入れる。ヘタの反対側を少し切り落とし、お箸などで軽く穴を開けておく。","茄子の高さ半分ほどの油を170度に熱する。","茄子を入れて転がしながら素揚げする。切り込みが広がり、揚げ音がしゅわしゅわと軽くなり太い部分を押したら柔らかくなるタイミングで引き上げて氷水に入れて冷ます。","氷水で冷やしながら皮を剥く。","1を被るくらいの少量容器に入れ、茄子を軽く絞り、漬ける。","再び軽く絞り食べやすい大きさに切り分けて残りの漬け地につける。冷蔵庫で冷やす（30分〜）","お好みで大葉や生姜などを添える。"]},{"group":"簡単なやり方","items":["茄子のへたを落とし、皮をピーラーで剥く。","水で濡らし、油を全面につけてラップを二重にして600W2分加熱する。","氷水で冷やす。","このあとは作り方5〜8と同じように皮をむいた茄子を漬け地に漬ける。"]}],"tips":[],"y":"ひすいなす なす だし なんぷらあ べいゆ なす べいゆ だし うすくちしょうゆ みりん なんぷらあ"},{"id":"r0005","title":"茗荷のじゃこの炊き込みご飯〜揚げもろこし〜","yield":"米300g（2合）分","photo":"p/p01_02.jpg","tags":{"ingredients":["米","茗荷","じゃこ","とうもろこし"],"season":["夏"],"category":["ご飯"]},"ingredients":[{"group":"","items":[{"name":"米","amount":"300g（2合）"},{"name":"茗荷","amount":"3-4個"},{"name":"じゃこ","amount":"15g"},{"name":"酒","amount":"大さじ1"},{"name":"昆布茶の元","amount":"小さじ1.5"},{"name":"薄口醤油","amount":"小さじ1.5"}]},{"group":"","items":[{"name":"とうもろこし","amount":"1/2本"},{"name":"塩","amount":"ひとつまみ"},{"name":"片栗粉","amount":"適量"},{"name":"揚げ油","amount":"適量"}]}],"steps":[{"group":"","items":["茗荷は2本、縦1/4横1/2に切る。","とうもろこしは列の窪みに沿って包丁を入れて持ち上げるように粒でとる。","洗った米、調味料を入れたら水をメモリまで入れてじゃこと茗荷、とうもろこしの芯を入れて炊く。","残りの茗荷は小口切りにしてさっと水にさらしておく。","とうもろこしの粒の水気を拭いて片栗粉をまぶし、1分ほど揚げて塩をふる。","米が炊けたら4を混ぜる。","器に盛り、とうもろこしを添える。好みで山椒や黒胡椒をふる。"]}],"tips":[],"y":"みょうがのじゃこのたきこみごはん〜あげもろこし〜 べい みょうが じゃこ とうもろこし べい みょうが じゃこ さけ こんぶちゃのもと うすくちしょうゆ とうもろこし しお かたくりこ あげあぶら"},{"id":"r0006","title":"焼き魚入らず！モロヘイヤと白うりの冷や汁","yield":"中椀3、大椀2ほど","photo":"p/p08_01.jpg","tags":{"ingredients":["白瓜","モロヘイヤ","ツルムラサキ","オクラ","いりごま","味噌"],"season":["夏"],"category":["汁物"]},"ingredients":[{"group":"出汁","items":[{"name":"水","amount":"600cc"},{"name":"昆布","amount":"8-10g"},{"name":"鰹節","amount":"8-10g"},{"name":"いりこ","amount":"8-10匹"}]},{"group":"冷や汁","items":[{"name":"出汁","amount":"500cc"},{"name":"味噌","amount":"麦味噌 大さじ2＋濃いめの合わせ味噌または赤味噌 小さじ2（お家にあるものでok！おすすめはこちら。今回は使う麦味噌が濃いめなので（麦大さじ1.5、白みそ大さじ1.5、赤小さじ1.5）使ってます）"},{"name":"いりごま","amount":"大さじ3（すりごま代用ok）"},{"name":"魚粉","amount":"小さじ2（今回はいりことかつお両方使ってます）"}]},{"group":"具材","items":[{"name":"ツルムラサキ","amount":"1束"},{"name":"オクラ","amount":"1本"},{"name":"白瓜","amount":"1/4〜1/6本"},{"name":"木綿豆腐","amount":"お好み"},{"name":"茗荷","amount":"1本"},{"name":"大葉","amount":"5枚"}]}],"steps":[{"group":"出汁","items":["昆布は1時間以上つけておく（できれば一晩冷蔵庫）いりこは頭と内臓を取り除く","鍋に1を入れて10分ほどかけて沸かして沸騰直前に昆布を取り出し鰹節を入れ、1分沸かしたら火を止めて鰹節が落ちたら濾す。（今回しっかり香を出したいので鰹節煮出します）"]},{"group":"冷や汁","items":["いりごまをすり鉢で半ずりくらいにし、味噌と魚粉を混ぜる。","アルミホイルに1を広げて魚焼きグリルかトースターで軽く焼き色と香ばしさが出るまで焼く。","出汁によく溶かす。"]},{"group":"具材","items":["白瓜は種をスプーンなどで除き薄切りにして塩揉みしたら水気を絞り、ツルムラサキは洗って半分に、オクラは板ずりをして水分ついたまま耐熱皿におき軽くラップをして600w1分半加熱したら氷水で冷やし、水気を絞り5mmほどに刻み、茗荷と大葉は千切りにする。"]},{"group":"完成","items":["全ての具材を合わせる（豆腐はスプーンですくって好きな量入れてね）","モロヘイヤは入れて置いておくと汁がドロドロになるので食べる前に入れるとよき"]}],"tips":["冷や汁は焼き魚を使うことが多いですが、汁物として使うときは重たくなりがち。使わないでもコクとうまみ、香りを出してさらっといただけるレシピです。","メイン級にしたい時はぜひ干物や簡単に缶詰などでも入れてみてね。","今回はモロヘイヤと白瓜ですが、胡瓜とトマトなどお好きなお野菜でも","味噌は2〜3種類合わせて入れると美味しい","（手書きメモ）すりすぎないように プチプチ残るくらい（いりごまの行に書き込み）","（手書きメモ）ひと晩おくとずるずるになっちゃう（ツルムラサキ・オクラをかっこでくくって書き込み）","（手書きメモ）好きなように（具材全体をかっこでくくって書き込み）","麦ご飯にごま油・刻んだ梅干し・大葉を混ぜたおにぎりを添えても"],"y":"やきざかなはいらず!もろへいやとしろうりのひやじる しろうり もろへいや つるむらさき おくら いりごま みそ みず こんぶ かつおぶし いりこ だし みそ いりごま ぎょふん つるむらさき おくら しろうり もめんとうふ みょうが おおば"},{"id":"r0007","title":"手作り煎り酒とガリの鯵の博多押し","yield":"十字切り型（内寸7.4×7.4×3.6）で作ります","photo":"p/p09_01.jpg","tags":{"ingredients":["鯵","胡瓜","卵","ガリ","とろろ昆布","梅干し"],"season":["夏"],"category":["前菜"]},"ingredients":[{"group":"","items":[{"name":"刺身用の鯵","amount":"半身1枚分"},{"name":"☆","amount":"水100cc＋塩4g"},{"name":"胡瓜","amount":"1/2本"},{"name":"卵","amount":"1個＋砂糖小さじ1/2（お教室では卵1/2個で作ります）"},{"name":"ガリ","amount":"適量"},{"name":"大葉","amount":"1枚"},{"name":"とろろ昆布","amount":"適量"},{"name":"食用菊","amount":"適宜"}]},{"group":"煎り酒（梅感しっかり目の作り方）大体180g","items":[{"name":"日本酒","amount":"400cc"},{"name":"昆布","amount":"10g"},{"name":"鰹節","amount":"10g"},{"name":"梅干し","amount":"大3個（45gほど）"}]},{"group":"煎り酒調味用","items":[{"name":"煎り酒","amount":"100cc"},{"name":"しょっつる","amount":"小さじ1.5"},{"name":"醤油","amount":"小さじ1/4"},{"name":"砂糖","amount":"小さじ1/2"}]}],"steps":[{"group":"","items":["鯵はさばいて骨と皮を除き☆に5分つけたら（立て塩）水分をふく。そぎ切りにし煎り酒に30分ほど漬ける（刺身用でもokその場合は塩水で軽く洗い水気をふき漬ける）","胡瓜は薄切りにして煎り酒に30分漬ける。","卵は耐熱容器に砂糖と入れてよく混ぜ、レンジ600wで30秒したら取り出しよく混ぜ、再び30秒加熱してよく混ぜておく（この際フォークやミニ泡立て器を使うと綺麗に細かくなる）","胡瓜は軽く絞る。","押し型にラップをし、鯵で胡瓜・卵・ガリ・大葉を挟む。この際所々にとろろ昆布を挟むと風味もよく剥がれづらくなるのでおすすめ！（押し型がなければタッパや容器で代用ok）","ラップのまま切り、外してお皿に盛り煎り酒を少しかける。飾りで菊を散らす。"]},{"group":"煎り酒","items":["酒に昆布と梅干しをつけておく（1時間以上できれば一晩）","中弱火で火にかけて10分ほどかけて沸騰直前になったら昆布を取り出す。","梅のタネを取り除き戻し3分ほどしっかり沸騰させてアルコールを飛ばす。","弱火にしたら鰹節を入れて15分弱火にかけて大体2/3-1/2ほどの量に煮詰める。","冷ます（この状態で一晩置くと良い）","ふきんでしっかり絞る。"]}],"tips":[],"y":"てづくりいりざけとがりのあじのはかたおし あじ きゅうり たまご がり とろろこんぶ うめぼし さしみようのあじ ☆ きゅうり たまご がり おおば とろろこんぶ しょくようきく にっぽんしゅ こんぶ かつおぶし うめぼし いりざけ しょっつる しょうゆ さとう"},{"id":"r0008","title":"鯵の冬瓜包み・挟み米衣揚げ～新生姜と酢橘のあん～","yield":"2人分","photo":"p/p10_01.jpg","tags":{"ingredients":["鯵","冬瓜","米","新生姜","酢橘"],"season":["夏"],"category":["主菜"]},"ingredients":[{"group":"","items":[{"name":"鯵","amount":"大1尾"},{"name":"冬瓜","amount":"幅10cmほどの薄切りを6枚"},{"name":"生米","amount":"30g"},{"name":"卵白","amount":"1個分（粉を水で固めに溶いたものでも大丈夫だけど卵白の方がザクザク感up）"}]},{"group":"あん","items":[{"name":"新生姜","amount":"10g"}]},{"group":"・","items":[{"name":"出汁","amount":"150cc"},{"name":"薄口醤油","amount":"小さじ1"},{"name":"みりん","amount":"小さじ1"},{"name":"酒","amount":"小さじ1"}]},{"group":"そのほか","items":[{"name":"片栗粉","amount":"適量（作り方5で鯵に振る分と、作り方8のあんのとろみ用）"},{"name":"酢橘の皮","amount":"適量"},{"name":"紅だて","amount":"適宜"}]}],"steps":[{"group":"","items":["生米を被るくらいの水に1時間以上置いておく。水気をしっかり拭いたら保存袋に入れて平たくしてめん棒やボトルなどで潰して細かくする。orすり鉢でも","鯵はさばいて半身2枚にしておく。（皮はついたまま、ぜいごと骨は外す）薄く塩をして10分おき、出てきた水気を拭いておく。","あんを作っておく・新生姜は針生姜にしてさっと水にさらす。","鍋に・の材料と冬瓜を入れ10分煮る。火を消し冬瓜を取り出し新生姜を入れておく。","（包む場合）鯵半身内側に片栗粉を振り、冬瓜3枚を重ねて置き巻いたら爪楊枝でしっかり止める。（挟む場合）鯵を三等分に切る。","卵白をよく切る。鯵の全体に卵白をつけて1の衣を付けて（包む場合）揚げる（挟む場合）揚げ焼きする。中弱火くらいで1面2分くらいかけて揚げると食感が良くなる。","器に（包む場合）爪楊枝を抜いておく。（挟む場合）冬瓜と交互におく。","あんを温め直したら水溶き片栗粉でとろみを付けて7にかける。","酢橘の皮を散らし紅だてを添える"]}],"tips":[],"y":"あじのとうがつつみ・はさみべいころもあげしんしょうがとすだちのあん あじ とうが べい しんしょうが すだち あじ とうが なまごめ らんぱく しんしょうが だし うすくちしょうゆ みりん さけ かたくりこ すだちのかわ くれないだて"},{"id":"r0009","title":"黒七味香るズッキーニとエビの黄身煮","yield":"1人分","photo":"p/p12_01.jpg","tags":{"ingredients":["ズッキーニ","えび","卵黄","黒七味"],"season":["夏"],"category":["温菜"]},"ingredients":[{"group":"","items":[{"name":"ズッキーニ（3mm厚の輪切り）","amount":"2枚"},{"name":"えび","amount":"2尾"},{"name":"卵の黄身","amount":"1個分"},{"name":"片栗粉","amount":"適量"},{"name":"黒七味","amount":"適量"}]},{"group":"出汁","items":[{"name":"出汁","amount":"200cc"},{"name":"みりん","amount":"15cc"},{"name":"醤油","amount":"10cc"},{"name":"砂糖","amount":"小さじ1/4"},{"name":"塩","amount":"ひとつまみ"}]}],"steps":[{"group":"","items":["ズッキーニは3mmほどの厚さに切り、皮を縞々状にする。","えびはしっぽを残し皮を剥く。尻尾の尖った部分を外し、先を少し切り落とす。片栗粉と塩（分量外）をかけて少し水を入れてもみ洗いして流して水気をふく。内側から切り込みを入れて開く。この際背ワタをとる。切り込み側を下にして少し上から押してまっすぐにする。","出汁を沸かす。（ポコポコして沸騰し始めくらい。）","材料に粉はたき、卵黄をつけたら3に入れる。一度に入れると出汁の温度が下がるため、一個入れ出汁が再沸騰したら次も入れる感じ。2分ほどしたら取り出す。","器に盛り、出汁を少し回し入れて黒七味をかける。"]}],"tips":["写真は車麩も入っています。好きな具材でぜひ♪","（手書きメモ）少し薄くしてもOK.（＊出汁＊の材料5つをかっこでくくって書き込み）"],"y":"くろしちみかおるずっきいにとえびのきみに ずっきいに えび らんおう くろしちみ ずっきいに(3みりめえとるあつのわぎり) えび たまごのきみ かたくりこ くろしちみ だし みりん しょうゆ さとう しお"},{"id":"r0010","title":"枝豆柚子胡椒風味","yield":null,"photo":"p/p12_02.jpg","tags":{"ingredients":["枝豆","柚子胡椒","白出汁"],"season":["夏"],"category":["副菜"]},"ingredients":[{"group":"","items":[{"name":"生えだまめ","amount":"100g"}]},{"group":"調味液","items":[{"name":"水","amount":"30cc"},{"name":"柚子胡椒","amount":"小さじ2/3"},{"name":"白出汁","amount":"小さじ1"},{"name":"塩","amount":"小さじ1/4"}]},{"group":"","items":[{"name":"塩","amount":"大さじ1/2＋大さじ1"}]}],"steps":[{"group":"","items":["枝豆の両端をキッチンバサミで切り落とす。","ボウルに入れて塩大さじ1/2で揉み込むように強く塩揉みする","500ccの水に塩大さじ1を入れて沸騰させたら2を塩ごと全て入れ、再沸騰したら3分ほどゆでる（お好みで5分）","ざるにあげる。調味液は混ぜ合わせておき（火にはかけない）、ゆでた枝豆を熱いうちに調味液につけ、冷めるまで30分ほどおく。"]}],"tips":[],"y":"えだまめゆずこしょうふうみ えだまめ ゆずこしょう しろだし なまえだまめ みず ゆずこしょう しろだし しお しお"},{"id":"r0011","title":"春キャベツと絹さやとしらすの塩麹和風コールスロー", :"ごま油","amount":"大さじ1"},{"name":"いりごま","amount":"適量"},{"name":"鷹の爪","amount":"適量"},{"name":"糸唐辛子","amount":"適宜"}]}],"steps":[{"group":"","items":["蓮根は縦半分に切ったら縦に食べやすい大きさに切る。（皮はむかなくてok）エリンギは割く。","フライパンにごま油と鷹の爪と蓮根を入れて弱火でじっくり炒めたらエリンギを加え炒める。","酒、みりん、砂糖を入れて軽く炒めたら醤油を入れて再度炒める。絡んだらいりごまを入れる。","器に盛り糸唐辛子を添える。"]}],"tips":["蓮根は先の細い節はシャキシャキ（サラダ・きんぴら向き）、太い節はほっこり（すりおろし・煮物向き）","（手書きメモ）作り方1の「縦」に丸"],"y":"しゃきしゃきれんこんとえりんぎのきんぴら れんこん えりんぎ ごまゆ たかのつめ れんこん えりんぎ しょうゆ さけ みりん さとう ごまゆ いりごま たかのつめ いととうがらし"},{"id":"r0031","title":"サーモンの砧巻き","yield":"4個分","photo":"p/b2_p20_02.jpg","tags":{"ingredients":["サーモン","大根","三つ葉","すし酢"],"season":["冬"],"category":["前菜"]},"ingredients":[{"group":"","items":[{"name":"サーモン柵","amount":"大体80g"},{"name":"大根","amount":"6cm"},{"name":"三つ葉","amount":"4本"}]},{"group":"1（ブライン液）","items":[{"name":"水","amount":"80cc"},{"name":"塩","amount":"小さじ1"},{"name":"砂糖","amount":"小さじ1/2"}]},{"group":"2","items":[{"name":"すし酢","amount":"50cc"},{"name":"水","amount":"60cc"}]}],"steps":[{"group":"","items":["サーモンは大根の幅に合うように長さ6cm、幅1cm弱に切り8本作り、1のブライン液に漬けて冷蔵庫で30分〜1時間置く。","大根は皮を剥いて20cmほど桂むきをする。2枚作る。2に30-1時間程漬ける。","三つ葉はさっと茹でる。","1,2を取り出して大根にサーモンをそれぞれ4本ずつ巻く。（手前2cmほど開けてサーモンを2個並べその上に2個乗せて四角くしてまく。）","1本に対して茹でた三つ葉を2本ずつ離して結ぶ。真ん中を切って2個にする。"]}],"tips":["（手書きメモ）1はブライン液","（手書きメモ）サラダチキン かたくならない（ブライン液の効果についてのメモと読める）"],"y":"さあもんのきぬたまき さあもん だいこん みつば すしず さあもんさく だいこん みつば みず しお さとう すしず みず"},{"id":"r0032","title":"冬瓜と柔らかささみの手作りへベス塩ポン酢和え","yield":"2人前","photo":"p/b2_p22_01.jpg","tags":{"ingredients":["冬瓜","ささみ","へベス","大葉"],"season":["夏"],"category":["冷菜"]},"ingredients":[{"group":"","items":[{"name":"冬瓜","amount":"120g"},{"name":"ささみ","amount":"3〜4本"},{"name":"大葉","amount":"1枚"},{"name":"水","amount":"800cc"},{"name":"酒","amount":"大さじ2"}]},{"group":"へベスポン酢","items":[{"name":"へベス","amount":"2個（果汁30g）"},{"name":"酒","amount":"50g"},{"name":"みりん","amount":"30g"},{"name":"塩","amount":"小さじ1/2"},{"name":"砂糖","amount":"小さじ1/8"},{"name":"出汁昆布","amount":"3g"},{"name":"鰹節","amount":"2-3g"},{"name":"薄口醤油","amount":"3-4滴"}]}],"steps":[{"group":"へベスポン酢","items":["へベスを絞る。（別の柑橘でも！）","酒とみりんを煮切り、塩、砂糖を入れて溶かす。","1.2を合わせて鰹節と昆布を入れたら6時間〜1晩置き絞る。"]},{"group":"和え物","items":["水と酒を沸騰させたら火を止めてささみをいれる。この際に軽く混ぜる。","小さめ4-5分、大きめ5-6分放置したら取り出し、塩小さじ1/4と合わせて4-5分置く。","冬瓜は皮を剥いてタネの部分を落とし食べやすい大きさの薄切りにして塩もみして水分をしっかり絞る。","大葉は細切りにする。","ささみをほぐす。（この際に筋をとる）","全ての材料とへベスポン酢を20gほど合わせる。"]}],"tips":["（手書きメモ）とうがん 夏が旬","ゆでる水800ccはささみ3〜4本の場合。1本なら400cc","（手書きメモ）へベスはタネない","（手書きメモ）ささみは「あまり放置せず！」（作り方2の「小さめ4-5分」に下線）","（手書きメモ）筋はほぐすときでOK！","（手書きメモ）塩 たんぱく質の凝固作用がある"],"y":"とうがとやわらかささみのてづくりへべすえんぽんずあえ とうが ささみ へべす おおば とうが ささみ おおば みず さけ へべす さけ みりん しお さとう だしこんぶ かつおぶし うすくちしょうゆ"},{"id":"r0033","title":"煎り酒でいただく帆立と冬瓜の冷菜","yield":"2人分","photo":"p/b2_p23_01.jpg","tags":{"ingredients":["帆立","冬瓜","梅干し","昆布","鰹節"],"season":["夏"],"category":["冷菜"]},"ingredients":[{"group":"","items":[{"name":"刺身用帆立","amount":"2粒"},{"name":"冬瓜","amount":"120g"}]},{"group":"煎り酒","items":[{"name":"酒","amount":"200cc"},{"name":"醤油","amount":"小さじ1"},{"name":"塩","amount":"小さじ1/2〜1"},{"name":"梅干し","amount":"2個"},{"name":"だし昆布","amount":"10cm角"},{"name":"鰹節","amount":"ひとつかみ"}]},{"group":"そのほか","items":[{"name":"パリパリの塩","amount":"適量"}]}],"steps":[{"group":"","items":["酒、醤油、梅干し（軽く潰して）を火にかけて沸騰したら弱火にして昆布を加えて煮汁が半分くらいになるまで煮る。鰹節を入れて火を止める。味を見ながら塩を入れる（梅干で加減が変わります）。冷めたら濾す。（しっかりとギュ！と）","冬瓜はピーラーで皮をむき緑の部分に塩を塗り込んで薄切りにする。熱湯で3分茹でたら冷やす。","帆立は横1/3に切る。","1.2.3を合わせて冷蔵庫で15分以上寝かせておく。器に盛りパリパリのお塩を軽く振る（お好みで）。"]}],"tips":["（手書きメモ）煎り酒は白身魚など、しょうゆだと強くなってしまう食材に"],"y":"いりざけでいただくほたてととうがのれいさい ほたて とうが うめぼし こんぶ かつおぶし さしみようほたて とうが さけ しょうゆ しお うめぼし だしこんぶ かつおぶし ぱりぱりのしお"},{"id":"r0034","title":"しじみとミョウガのお吸い物","yield":null,"photo":"p/b2_p23_02.jpg","tags":{"ingredients":["しじみ","ミョウガ","昆布"],"season":["夏"],"category":["汁物"]},"ingredients":[{"group":"","items":[{"name":"ミョウガ","amount":"1/2〜1個"},{"name":"しじみ","amount":"150g"},{"name":"水","amount":"300cc"},{"name":"出汁昆布","amount":"5g"},{"name":"酒","amount":"大さじ1"},{"name":"塩","amount":"小さじ1/2"},{"name":"薄口醤油","amount":"少々"}]}],"steps":[{"group":"","items":["しじみは浅いバットに重ならないように並べて塩水を少し上が出るくらいまで入れてホイルなどを被せて3〜4時間冷蔵庫に置いておく。流水でよくこすり洗いする。","ミョウガは細く千切りにしてさっと水にさらす。","鍋に水、出汁昆布、酒としじみを入れて中弱火にかけて沸騰するまでの時間を少し長めにとる。（10分ほど）","沸いたら火を弱め、しじみの殻が開いたら昆布と灰汁をのぞく。","味を見ながら塩と薄口醤油を加える。お椀に盛りミョウガを入れる。"]}],"tips":["（手書きメモ）しじみは身をそんなに食べる貝ではない"],"y":"しじみとみょうがのおすいもの しじみ みょうが こんぶ みょうが しじみ みず だしこんぶ さけ しお うすくちしょうゆ"},{"id":"r0035","title":"アスパラ豆腐","yield":"小さめ3個（教室の大きさ）、大きめ2個分","photo":"p/b2_p24_01.jpg","tags":{"ingredients":["アスパラ","豆乳","葛粉","白出汁"],"season":["春"],"category":["前菜"]},"ingredients":[{"group":"","items":[{"name":"アスパラ","amount":"150g"},{"name":"豆乳（無調整）","amount":"200g"},{"name":"水","amount":"50cc"},{"name":"葛粉","amount":"25g"},{"name":"白出汁","amount":"小さじ2"},{"name":"昆布茶の元","amount":"小さじ1/2"},{"name":"塩・砂糖","amount":"ひとつまみ"}]}],"steps":[{"group":"","items":["葛粉と水を合わせておく。","アスパラは茎の方1/6くらいを支点にしてポキっと折れるところで折る。そこから1cmほどピーラーで一周剥く。折った茎は端を切り落として包丁で厚めに皮を剥くと使える。（断面を見るとわかりやすい）","穂の部分は飾り用に二本分だけ切って別にしておく。","フライパンにお湯を沸かして塩を入れ、3以外を入れて2分30秒、3をその後入れて30秒茹でる。3の部分は別にして冷水に冷ましておくといい。","4と全ての材料をブレンダーやフードプロセッサーにかけて攪拌する。1もよく合わせる。","小鍋に5を入れて弱火にかけてゴムベラなどで底から混ぜながらこげつかないようによく混ぜながらじっくり火にかける。","もったりして塊になるくらいになったら（大体15分）ラップの上に落とし茶巾絞りをして輪ゴムで止め、氷水で冷やす。（好きな器に入れたり流し缶に入れて冷蔵庫で冷やしてもok）","器にうつし飾り用のアスパラを飾り、好みで、出汁を白出汁で味つけし水溶き片栗粉でとろみをつけたあんをかける。"]}],"tips":["（手書きメモ）豆乳は無調整"],"y":"あすぱらとうふ あすぱら とうにゅう くずこ しろだし あすぱら とうにゅう(むちょうせい) みず くずこ しろだし こんぶちゃのもと しお・さとう"},{"id":"r0036","title":"戻り鰹の漬けとあたり葱","yield":null,"photo":"p/b2_p26_01.jpg","tags":{"ingredients":["かつお","アサツキ","鰹節","生姜"],"season":["秋"],"category":["前菜"]},"ingredients":[{"group":"","items":[{"name":"かつお刺し","amount":""},{"name":"醤油・みりん・酒","amount":"3:1:1（今回は醤油90cc、みりん・酒 各30cc）"},{"name":"鰹節","amount":"適量（今回は3-5g）"}]},{"group":"あたり葱","items":[{"name":"アサツキ（小口ネギでも）","amount":"適量"},{"name":"生姜汁","amount":"少し"}]}],"steps":[{"group":"漬け","items":["今回は醤油90cc、みりん・酒 各30cc、鰹節3-5g。","みりんと酒を火にかけ、煮たってアルコールが飛んだら醤油と鰹節を入れ再度沸騰させて火を止める。","ザルで濾し粗熱を取る。","刺身を1分ほど漬ける。"]},{"group":"あたり葱","items":["アサツキを細かく小口切りし、すり鉢でペースト状になるまでする。生姜汁を少し入れて馴染ませる。"]}],"tips":["（手書きメモ）サクの場 },{"name":"絹さや","amount":"4枚"},{"name":"どんこ","amount":"2個"},{"name":"出汁","amount":"100cc"},{"name":"どんこの戻し汁","amount":"100cc"},{"name":"酒","amount":"大さじ2"},{"name":"醤油・みりん","amount":"各大さじ2"}]}],"steps":[{"group":"","items":["人参・蓮根は皮をむいて1cm厚に切り、花型に切る（蓮根は酢水にさらす）。蒟蒻は1cm厚に切って中央に切れ目を入れ、端をくぐらせて手綱にする。どんこは4〜5時間水に入れて戻すか、10分水につけてラップをして600W20秒レンジにかけて常温に戻す。六角形に切る。絹さやはさっと塩茹でにして矢羽根に切る。蒟蒻は下ゆでする。","絹さや以外の材料を鍋で煮て汁が少なくなったら一度冷まし、再度温め直す。絹さやを添える。"]}],"tips":["様々な食材を一緒の鍋で煮ることから、“家族が仲良く一緒に結ばれ、末永く繁栄しますように”という意味が込められている。","蓮根：将来の見通しがよい／椎茸：六角形にして亀に見立て長寿／手綱こんにゃく：縁結び／梅花人参：実を結ぶ、寿"],"y":"はなにんじんとはなれんこんのにしめ にんじん れんこん こんにゃく ほししいたけ(どんこ) きぬさや はなにんじん はなれんこん たづなこんにゃく きぬさや どんこ だし どんこのもどしじる さけ しょうゆ・みりん"},{"id":"r0110","title":"いりこ出汁で白瓜のお味噌汁","yield":"二人分","photo":"p/b3_p53_01.jpg","tags":{"ingredients":["白瓜","いりこ","味噌","青ネギ"],"season":["夏"],"category":["汁物"]},"ingredients":[{"group":"","items":[{"name":"白瓜","amount":"80g"},{"name":"青ネギ","amount":"1本"},{"name":"いりこ","amount":"10g"},{"name":"味噌","amount":"大さじ2（できれば2〜3種類の味噌をまぜる）"},{"name":"水","amount":"500g"}]}],"steps":[{"group":"","items":["いりこは頭と内臓を除き水に30分以上つけておく。ざるの目になっているお玉状のものにいりこをいれると便利。","白瓜は皮をむいて縦半分にして種を除き、再び縦半分にし1.5cmに切る。青ネギも1.5cmに切る","1に白瓜を入れ中弱火にかけて沸騰して5分ほど煮たらいりこを取り除く。（ザル状のものがない場合は白瓜を入れずに5分したら濾してから入れる）","白瓜が柔らかくなったら火を止めて味噌を溶かし入れる。よそう直前に青ネギを入れる。"]}],"tips":[],"y":"いりこだしでしろうりのおみそしる しろうり いりこ みそ あおねぎ しろうり あおねぎ いりこ みそ みず"},{"id":"r0111","title":"白瓜の昆布浅漬け","yield":"記載なし（白瓜200g分）","photo":"p/b3_p53_01.jpg","tags":{"ingredients":["白瓜","刻み昆布","赤唐辛子","白だし"],"season":["夏"],"category":["副菜"]},"ingredients":[{"group":"","items":[{"name":"白瓜","amount":"200g"},{"name":"赤唐辛子","amount":"1本"},{"name":"刻み昆布","amount":"適量"},{"name":"塩","amount":"小さじ1/2弱"},{"name":"白だし","amount":"少々"}]}],"steps":[{"group":"","items":["白瓜はシマシマに皮をむく。縦半分にして種をのぞき5mmほどの薄切りにする。赤唐辛子は半分にして種を除く。","ポリ袋に全ての材料を入れてよく揉み、1時間以上置いておく。"]}],"tips":[],"y":"しろうりのこんぶあさづけ しろうり きざみこんぶ あかとうがらし しろだし しろうり あかとうがらし きざみこんぶ しお しろだし"},{"id":"r0112","title":"カニクリームコロッケ","yield":"2人分4個分","photo":"p/b3_p55_01.jpg","tags":{"ingredients":["かに（ほぐし身・缶）","玉ねぎ","マッシュルーム","牛乳","バター","パン粉"],"season":["冬"],"category":["主菜"]},"ingredients":[{"group":"","items":[{"name":"かにほぐし身、かに缶","amount":"70〜100g（缶詰のgなどで調整してね）沢山入れたらもっと蟹！"},{"name":"玉ねぎ","amount":"1/4個"},{"name":"セロリ（なくてもよい）","amount":"15g"},{"name":"ホワイトマッシュルーム","amount":"1個"},{"name":"バター","amount":"20g"}]},{"group":"・","items":[{"name":"白ワイン（酒）","amount":"大さじ1"},{"name":"醤油","amount":"2〜3滴"},{"name":"フォメドポワソン（コンソメ）（なくてもよい）","amount":"小さじ1/2弱"},{"name":"塩","amount":"小さじ1/8（コンソメ類なければ小さじ1/4）"}]},{"group":"","items":[{"name":"牛乳（＋蟹汁）","amount":"180cc"},{"name":"小麦粉","amount":"15g"},{"name":"粉チーズ（なくてもよい）","amount":"小さじ1"},{"name":"ホワイトペッパー","amount":"適宜"}]},{"group":"衣","items":[{"name":"バッター液（卵1、小麦粉大さじ3、水大さじ2）","amount":""},{"name":"細かめパン粉","amount":"適量"}]},{"group":"ソース","items":[{"name":"中濃ソース","amount":"40g"},{"name":"ケチャップ","amount":"20g"}]}],"steps":[{"group":"","items":["玉ねぎ、セロリ、ホワイトマッシュはみじん切りにする。","フライパンを中弱火にかけバターを入れ溶けてきたら玉ねぎとセロリを炒める。透き通ってきたらマッシュルームと蟹の身を入れてしっかり炒める。","白ワイン、フォメドポワソン、塩、醤油を入れてアルコールを飛ばしたら一度火を止める。","小麦粉を入れて粉っぽさがなくなるまで混ぜる。中弱火で30秒ほどしっかり混ぜながら火にかける。","牛乳を1/4量入れどろっとするまで混ぜる。同様に1/4量ずつ加えていく。","粉チーズとホワイトペッパーを加えてバットに入れて粗熱をとり、冷凍庫へ入れて1時間ほど冷やす（触ってくっつかず弾力がある感じ。ナイフで切り込みがしっかり入る。）（冷凍しておいて丸めやすい硬さまで解凍するのでも）","6を4等分にして俵形に成形する（ゴム手袋をすると表面が温まりにくい、油を手に塗るとくっつかない）","混ぜておいたバッター液につけて、パン粉の上に乗せて上からたっぷりかけて優しく押さえる。","180度くらいに熱した油に入れて（温度が下がるので一気に入れない）狐色になったらあげる（つついたりすると破れる原因になるのでなるべくさわらない）","中濃ソースとケチャップを混ぜてお皿に敷き、その上にコロッケをのせる。"]}],"tips":["セロリやコンソメ、粉チーズなどはなくてもok","（手書きメモ）かにの分量の横に「何グラムでもOK」","（手書きメモ）フォメドポワソンに矢印で「シーフードver.」","（手書きメモ）粉チーズの横に「入れなくても入れても」"],"y":"かにくりいむころっけ かに(ほぐしみ・かん) たまねぎ まっしゅるうむ ぎゅうにゅう ばたあ ぱんこな かにほぐしみ、かにかん たまねぎ せろり(なくてもよい) ほわいとまっしゅるうむ ばたあ しろわいん(しゅ) しょうゆ ふぉめどぽわそん(こんそめ)(なくてもよい) しお ぎゅうにゅう(+かにじる) こむぎこな こなちいず(なくてもよい) ほわいとぺっぱあ ばったあえき(たまご1、こむぎこなおおさじ3、みずおおさじ2) こまかめぱんこな ちゅうのうそおす けちゃっぷ"},{"id":"r0113","title":"金目鯛の煮付け","yield":"2人前","photo":"p/b3_p57_01.jpg","tags":{"ingredients":["金目鯛","ゴボウ","生姜","長ネギ","たまり醤油"],"season":["冬"],"category":["主菜"]},"ingredients":[{"group":"","items":[{"name":"金目鯛の切り身","amount":"2切れ"},{"name":"ゴボウ","amount":"5cmほど"},{"name":"生姜","amount":"薄切り4枚"},{"name":"長ネギ（白髪葱用）","amount":"10cmを2個"},{"name":"水","amount":"100cc"},{"name":"酒","amount":"200cc"},{"name":"砂糖","amount":"大さじ2"},{"name":"みりん","amount":"大さじ2"},{"name":"たまり醤油","amount":"大さじ1.5（なければ濃口醤油 大さじ3）"},{"name":"濃口醤油","amount":"小さじ1"}]}],"steps":[{"group":"","items":["金目はザルに皮目を上にして乗せて上から熱湯をかける。皮目からだけでいいが血合いなどある場合はそこにもかける。氷水につけて鱗や汚れ、血合などとり、水気をしっかり拭く。","鍋にゴボウ、水、酒を入れて1を皮目を上にして入れ中強火にかける。","沸いたら中火にして砂糖、みりん、生姜を入れて落とし蓋をして3分煮る。","たまり醤油、醤油を入れて落とし蓋をして3〜4分煮る。","落とし蓋を外してタレを上から何度かまわしかける。","魚と生姜を取り出して皿に盛り、残りの煮汁をとろみが出るまで煮詰める。","ゴボウを添えて煮汁を上からかけて白髪葱をのせる。"]},{"group":"白髪葱","items":["10cmの長さに切ったネギを用意。","縦に切り込みを中心まで入れて開き、中心にある緑の部分を取り除く。","残りの白い部分の1枚1枚、内側についている薄い膜を剥く。","縦にできるだけ細く千切りをする。","氷水に入れて10分ほどしてくるっとしたらキッチンペーパーなどでしっかり水気を絞る。"]}],"tips":["アクはこまめに取りましょう♪","（手書きメモ）ゴボウに線を引いて「煮付けは風味がよくなる」","（手書きメモ）たまり醤油に線を引いて「お店の味になる!!」","（手書きメモ）作り方2の横に「火をかける前から魚を入れる」「アクは取る。」","甘みをしっかり出すため、砂糖・みりんを醤油より先に入れる。","（手書きメモ）作り方4の醤油に線を引いて「しょうゆは香りがとびやすい」"],"y":"きんめたいのにつけ きんめたい ごぼう しょうが ながねぎ たまりしょうゆ きんめたいのきりみ ごぼう しょうが ながねぎ(しらがねぎよう) みず さけ さとう みりん たまりしょうゆ こいくちしょうゆ"},{"id":"r0114","title":"薬味梅エスカベッシュ","yield":"2人分","photo":"p/b3_p59_01.jpg","tags":{"ingredients":["魚（メカジキ）","蜂蜜梅干し","玉ねぎ","ホワイトセロリ","大葉","茗荷"],"season":["夏"],"category":["主菜","冷菜"]},"ingredients":[{"group":"","items":[{"name":"お好きなお魚（メカジキなど・冷凍でない生のもの）","amount":""}]},{"group":"","items":[{"name":"玉ねぎ","amount":"1/4"},{"name":"ホワイトセロリ","amount":"1/2（セロリ 1/4）"},{"name":"大葉","amount":"4〜5枚"},{"name":"茗荷","amount":"1個"},{"name":"蜂蜜梅干し","amount":"大粒2個"},{"name":"にんにく","amount":"ひとかけ"},{"name":"鷹の爪（青唐辛子があれば）","amount":"2本"},{"name":"米油","amount":"大さじ3"}]},{"group":"・","items":[{"name":"米酢","amount":"大さじ3"},{"name":"酒","amount":"大さじ2"},{"name":"砂糖","amount":"小さじ2"},{"name":"醤油","amount":"小さじ1/2"}]},{"group":"","items":[{"name":"小麦粉","amount":"適量"},{"name":"塩","amount":"適量"},{"name":"粗挽き黒胡椒","amount":"適量"}]}],"steps":[{"group":"","items":["魚は食べやすい大きさに切り塩と粗挽き黒胡椒を振っておく。・の調味料を合わせておく。","にんにくを潰す。唐辛子は半分にして種を除く。","玉ねぎは繊維に沿って薄切り、ホワイトセロリは葉と茎を分け茎の部分を2cmに切る（セロリの場合は繊維をとって薄切り、葉の部分をざく切りにする）。大葉は細切り、茗荷は千切りにする。梅干しは種を除き4等分にする。","フライパンに米油と2を入れて弱火にかけてじっくりと香りを出す。玉ねぎとセロリの茎を入れさっと炒めたら合わせた調味料と梅干しを入れる。お酢の酸味を飛ばしたらタッパーやバットなどに入れて、茗荷・大葉・葉の部分を加えて馴染ませる。","魚の表面の水分を拭いたら小麦粉をまぶし、表面がキツネ色になるまで揚げる。","4に5を入れて15分ほど漬ける。（冷やして食べても美味しい！）"]}],"tips":[],"y":"やくみばいえすかべっしゅ さかな(めかじき) はちみつうめぼし たまねぎ ほわいとせろり おおば みょうが おすきなおさかな(めかじきなど・れいとうでないなまのもの) たまねぎ ほわいとせろり おおば みょうが はちみつうめぼし にんにく たかのつめ(あおとうがらしがあれば) べいゆ こめず さけ さとう しょうゆ こむぎこな しお あらびきくろこしょう"},{"id":"r0115","title":"ゆり根ごはん","yield":null,"photo":"p/b3_p61_01.jpg","tags":{"ingredients":["ゆり根","米","三つ葉","昆布"],"season":["冬"],"category":["ご飯"]},"ingredients":[{"group":"","items":[{"name":"ゆり根","amount":"1個"},{"name":"米","amount":"2合"},{"name":"酒","amount":"大さじ2"},{"name":"みりん","amount":"小さじ2"},{"name":"塩","amount":"小さじ1.5"},{"name":"薄口醤油","amount":"小さじ1"},{"name":"出汁昆布","amount":"6g"}]},{"group":"そのほか","items":[{"name":"三つ葉","amount":"適量"},{"name":"ゆかり","amount":"適量"}]}],"steps":[{"group":"","items":["お米はといで昆布と水（2合目盛りより下）に30分ほどつけておく。","ゆり根はおがくずを洗い流し、外側から一枚ずつはがし水をはったボウルに入れていく。汚れや土を綺麗に落とす。取れないものは包丁で取り除く。大きいものは小さいものに大きさを合わせる。","1に調味料を入れてメモリ少し下まで水を入れて混ぜる。ゆり根を入れて炊く。","炊けたら昆布を取り出し1cmほどに切った三つ葉を合わせる。ゆかりは味変におすすめ！"]}],"tips":["（手書きメモ）さっぱりな味","（手書きメモ）しば漬けも合う。"],"y":"ゆりねごはん ゆりね べい みつば こんぶ ゆりね べい さけ みりん しお うすくちしょうゆ だしこんぶ みつば ゆかり"},{"id":"r0116","title":"パパッと小イカとセリのたらこ和え","yield":null,"photo":"p/b3_p61_02.jpg","tags":{"ingredients":["小イカ","セリ","たらこ","白出汁"],"season":["春"],"category":["副菜"]},"ingredients":[{"group":"","items":[{"name":"小イカ","amount":"1杯（なければイカの刺身用30g）"},{"name":"セリ","amount":"8本〜10本"},{"name":"たらこ","amount":"1/2腹"},{"name":"白出汁","amount":"大さじ2"},{"name":"水","amount":"100cc"},{"name":"薄口醤油","amount":"少々"}]}],"steps":[{"group":"","items":["セリは根っこを切り落とし水につけてよく洗っておく。","沸騰したお湯に塩（分量外）を入れて茎5秒、全部入れて5秒茹でたら氷水に入れて冷まし水気をキッチンペーパーでしっかり切る。","白出汁と水を混ぜたものに薄口醤油を3滴ほど入れてセリを30分以上浸けておく。","小イカは胴体を開き内臓や目、口をとり1cmの幅にきる。げそは1,2本に分けて長いものは切っておく。","4の小イカを10秒ほど茹でたら氷水に入れて冷やす。（セリのお湯と氷水を使ってよい）水気を切る。","たらこは薄皮を縦に切って開き、中の部分をとる。","セリの水分を軽くしぼり、イカ、たらこと和えたら薄口しょうゆを少し回しかける。"]}],"tips":["根っこは片栗粉をまぶして揚げて塩をかける。"],"y":"ぱぱっとこいかとせりのたらこあえ こいか せり たらこ しろだし こいか せり たらこ しろだし みず うすくちしょうゆ"},{"id":"r0117","title":"新玉ねぎのすり流し","yield":"2人前","photo":"p/b3_p62_01.jpg","tags":{"ingredients":["新玉ねぎ","出汁","白味噌","黒七味"],"season":["春"],"category":["汁物"]},"ingredients":[{"group":"","items":[{"name":"新玉ねぎ","amount":"大1個"},{"name":"出汁","amount":"200cc"},{"name":"塩","amount":"ふたつまみ＋α"},{"name":"薄口醤油","amount":"小さじ1/4"},{"name":"白味噌","amount":"小さじ1"},{"name":"黒七味","amount":"適量"}]}],"steps":[{"group":"","items":["新玉ねぎは繊維を断つように薄切りにする。","鍋に1と水大さじ1（分量外）を入れ塩ふり、蓋をして弱火にかけ20分程蒸し煮にする。","出汁に白味噌を溶かしておく。","3を半量2に入れてブレンダーで攪拌する（ミキサーでも）。","残りの出汁をまぜ合わせたら味見をして塩と薄口醤油で調整して（ひとつまみ〜ふたつまみ程）器に注ぎ黒七味をのせる。"]}],"tips":[],"y":"しんたまねぎのすりながし しんたまねぎ だし しろみそ くろしちみ しんたまねぎ だし しお うすくちしょうゆ しろみそ くろしちみ"},{"id":"r0118","title":"イカゲソとこごみの辛子酢味噌がけ","yield":null,"photo":"p/b3_p62_02.jpg","tags":{"ingredients":["イカゲソ","こごみ","白味噌","辛子"],"season":["春"],"category":["副菜"]},"ingredients":[{"group":"","items":[{"name":"げそ","amount":"2杯分"},{"name":"こごみ","amount":"6本"}]},{"group":"・","items":[{"name":"白味噌","amount":"大さじ2"},{"name":"砂糖・みりん","amount":"各大さじ1"},{"name":"お酢","amount":"小さじ1＋大さじ1.5"},{"name":"辛子","amount":"適量"}]}],"steps":[{"group":"","items":["こごみは硬い部分を切り落とす。沸騰したお湯に塩を入れ、1分半〜2分茹で冷水で冷やす。1/3に切る。","同じお湯でげそをさっとゆがき冷水で冷やす。","白味噌、砂糖、みりん、お酢小さじ1を耐熱皿に入れてよく混ぜて600w40秒チンする。","お酢大さじ1.5と辛子を入れてよく混ぜる。","お皿に盛る。"]}],"tips":[],"y":"いかげそとこごみのからしすみそがけ いかげそ こごみ しろみそ からし げそ こごみ しろみそ さとう・みりん おす からし"},{"id":"r0119","title":"芽キャベツと海老の青さ白扇揚げ","yield":"4個","photo":"p/b3_p63_01.jpg","tags":{"ingredients":["海老","芽キャベツ","あおさ","卵"],"season":["冬","春"],"category":["温菜"]},"ingredients":[{"group":"","items":[{"name":"海老","amount":"4尾"},{"name":"芽キャベツ","amount":"2個"},{"name":"青さ","amount":"適量"},{"name":"塩・片栗粉","amount":"ひとつまみ"},{"name":"卵黄","amount":"1個分（ここに入れても、醤油漬けにして次の日楽しんでも）"}]},{"group":"衣","items":[{"name":"卵白","amount":"1個分"},{"name":"片栗粉","amount":"大さじ2"},{"name":"水","amount":"大さじ1"}]},{"group":"そのほか","items":[{"name":"つけ塩","amount":"適量"}]}],"steps":[{"group":"","items":["衣の材料をよく混ぜておく。芽キャベツは根元の芯を少し切り落とし横半分に切る。","海老は殻をむきぶつ切りにしたら塩と片栗粉をひとつまみ、あおさを入れて包丁でよく叩く（ここで卵黄を加えてもよい）。4等分にする。","芽キャベツの切り口に片栗粉（分量外）をつけて2をしっかりのせる。4個作る。","揚げ油は低温にする（150-160度、菜箸の先から細かい泡が出るくらい）。","3に衣をしっかりつけて揚げ油に入れる。追い衣を菜箸で落とす。","じっくり揚げたら取り出し油を切って器に盛り、塩を添える。すだちなどを添えても！"]}],"tips":["写真は芽キャベツで挟んだバージョン"],"y":"めきゃべつとえびのあおさはくせんあげ えび めきゃべつ あおさ たまご えび めきゃべつ あおさ しお・かたくりこ らんおう らんぱく かたくりこ みず つけしお"},{"id":"r0120","title":"柚子香るヤリイカの菜の花とベーコンの印籠詰め","yield":"2人前（中身は大きいイカでも余るくらいの量なので余りがいらない時は半量にしてください。そのままの分量でおにぎりにしても！）","photo":"p/b3_p64_01.jpg","tags":{"ingredients":["ヤリイカ","菜の花","ベーコン","米","柚子"],"season":["春"],"category":["主菜"]},"ingredients":[{"group":"","items":[{"name":"ヤリイカ","amount":"2杯"},{"name":"新玉ねぎ","amount":"1/4個"},{"name":"ベーコン","amount":"30g"},{"name":"菜の花","amount":"3本"},{"name":"生米","amount":"1合（150g）"},{"name":"水","amount":"180cc"},{"name":"昆布茶の素","amount":"小さじ2"},{"name":"みりん・酒","amount":"各大さじ1"},{"name":"薄口醤油","amount":"一回し"},{"name":"米油","amount":"少々"}]},{"group":"餡","items":[{"name":"水","amount":"200cc"},{"name":"昆布茶の素","amount":"小さじ1"},{"name":"薄口醤油","amount":"小さじ1"},{"name":"鰹節","amount":"一掴み（出汁パックあれば1個。なくても〇）"},{"name":"水溶き片栗粉","amount":"小さじ1〜1.5＋同量水（緩めの餡になるように）"}]},{"group":"そのほか","items":[{"name":"刻み柚子","amount":"適宜"},{"name":"三つ葉","amount":"適宜"}]}],"steps":[{"group":"","items":["米は洗米して水に30分浸けておく。","（4の米を炊いている間にやる）ヤリイカを筒ぬきして内臓と軟骨をきれいに取りエンペラと皮を丁寧にとる。さっと中側と外側を洗い流す。食べやすくするために表面に薄く切り込みを入れておく。（しなくても）（ゲソを他の副菜に使わない場合は細かく切って3で炒める。）","ベーコンは細切り、新玉ねぎは角切り、菜の花は0.5cm幅に切る。フライパンに少量の油をひきベーコンと玉ねぎを炒める。","調味料、水を切った生米を入れて軽く混ぜたら水を加えて再び混ぜ、蓋をして沸いたら弱火で15分、火を止めて10分蒸らす。菜の花を入れて混ぜ、蓋をして5分おく。","2のイカに4をしっかり詰める。爪楊枝で止める。","フライパンを軽く流してペーパーで拭き、油を少量ひき5を入れて両面に少し焼き目をつける。","片栗粉以外の餡の材料を入れて蓋をして3分煮たらヤリイカを取り出し、水溶き片栗粉でとろみをつける。","ヤリイカを切って器に盛り、餡をかけて三つ葉と柚子を添える。"]}],"tips":[],"y":"ゆずかおるやりいかのなのはなとべえこんのいんろうづめ やりいか なのはな べえこん べい ゆず やりいか しんたまねぎ 大）","amount":"1個"},{"name":"長ネギ","amount":"20g"},{"name":"塩","amount":"小さじ1/4"}]},{"group":"☆","items":[{"name":"生姜汁（あれば）","amount":"少々"},{"name":"卵白","amount":"1個分"},{"name":"酒","amount":"大さじ1/2"},{"name":"砂糖","amount":"小さじ1/4"},{"name":"昆布茶の元","amount":"小さじ1/2"},{"name":"片栗粉","amount":"小さじ1"}]},{"group":"","items":[{"name":"片栗粉","amount":"適量"},{"name":"ししとう","amount":"4個"},{"name":"米油","amount":"適量"}]},{"group":"銀餡","items":[{"name":"どんこの出汁＋水","amount":"合わせて200cc"},{"name":"酒","amount":"大さじ1"},{"name":"薄口醤油","amount":"小さじ2"},{"name":"みりん","amount":"小さじ1"},{"name":"塩","amount":"ひとつまみ"},{"name":"片栗粉","amount":"大さじ1/2"}]}],"steps":[{"group":"","items":["どんこは石突きを落としさっと水で流し100ccの冷水に入れて冷蔵庫で一晩おく。（時間がない場合は耐熱容器に入れ10分置いてレンジ600w30秒かけ、そのまま粗熱が取れるまで置いておく（水出し推奨））","蓮根は5mm幅に薄切りにし皮をむき水にさらす。長ネギはみじん切りに。どんこは5mm角くらいに刻む。","海老は殻をむき背ワタをとり塩・片栗粉・水ちょっと（分量外）で軽く揉み汚れや臭みをとり、水で洗いペーパーで水気をしっかりとる。粗めに叩く。","海老、どんこ、長ネギと塩を粘りが出るまで混ぜ、☆を入れてよく混ぜ合わせる。","2のレンコンの両面に片栗粉をまぶし、4枚にタネを1/4ずつ載せて残りの蓮根でしっかりと挟む。サイドにも片栗粉を軽くまぶしておく。","フライパンに油を敷いて中弱火にして5と獅子唐を載せて蓋をする。焼き目がついたらひっくり返して反対側にも焼き目をつける。皿に盛る。（ししとうは焼けたものからあげていく）","銀餡の材料を火にかけて一煮立ちしたら火を止め、水溶き片栗粉を混ぜながら入れてもう一度火にかけたら6にかける。"]}],"tips":["（手書きメモ）どんこを冷水に入れて冷蔵庫で一晩おくと、うま味成分が出る"],"y":"えびれんこんはさみやきほししいたけぎんあんがけ えび れんこん ほししいたけ(どんこ) ながねぎ ししとう えび れんこん どんこ(だい) ながねぎ しお しょうがしる(あれば) らんぱく さけ さとう こんぶちゃのもと かたくりこ かたくりこ ししとう べいゆ どんこのだし+みず さけ うすくちしょうゆ みりん しお かたくりこ"},{"id":"r0155","title":"焼きネギ香る舞茸と秋刀魚の土鍋ご飯","yield":"2合分","photo":"p/b4_p25_01.jpg","tags":{"ingredients":["秋刀魚","舞茸","長ネギ","新生姜","米","すだち"],"season":["秋"],"category":["ご飯"]},"ingredients":[{"group":"","items":[{"name":"秋刀魚","amount":"2尾"},{"name":"舞茸","amount":"150g"},{"name":"長ネギ","amount":"2本"},{"name":"新生姜","amount":"30g（根生姜の場合は水にさらす）"},{"name":"生米","amount":"300g（二合分）"},{"name":"水","amount":"380cc"},{"name":"出汁昆布","amount":"10〜15cm"}]},{"group":"☆","items":[{"name":"酒","amount":"大さじ1"},{"name":"薄口醤油","amount":"小さじ2"},{"name":"みりん","amount":"小さじ2"},{"name":"塩","amount":"小さじ1/2"}]},{"group":"そのほか","items":[{"name":"小口ネギ","amount":"適量"},{"name":"すだち","amount":"適量"},{"name":"三つ葉","amount":"適量"},{"name":"大根の鬼おろし（細切り大葉と和えると○）","amount":"適量"}]}],"steps":[{"group":"","items":["米を研ぎザルでしっかり水気を切り、ボウルに入れて水380ccと出汁昆布と30分浸水させる。","秋刀魚は三枚おろしにして身、骨、頭に塩をふり5〜10分したらペーパーで水気を拭く。（卸さない場合は内臓だけ出して皮目に切り込みを入れて塩を振る）","長ネギは縦半分、横3cmに切る。舞茸、新生姜は粗みじん切りにする。","長ネギと秋刀魚（骨と頭も）をグリルかフライパンで焼き目がつくまで焼く。骨と頭は焼けた後お茶パックなどに入れておくと便利。","土鍋に1を移し、大さじ2位の水を捨てる。☆の調味料を入れて混ぜる。","舞茸、長ネギ、秋刀魚（骨、頭も）を乗せて蓋をして中火にかける。","穴から蒸気が出てきたら火を極弱火にして11分炊く。","ここで骨と頭を取り出し、新生姜とすだちを散らして火を止めて15分蒸らす。","小口ネギをかけて混ぜ合わせる。（捌かなかった場合はここで秋刀魚を取り出し骨を除き戻す）","すだちや三つ葉、大根の鬼おろし（細切り大葉と和えると○）を添える。"]}],"tips":["小口ネギ、すだち、三つ葉、大根の鬼おろし（細切り大葉と和えると○）などなど、お好みで添える。"],"y":"やきねぎかおるまいたけとさんまのどなべごはん さんま まいたけ ながねぎ しんしょうが べい すだち さんま まいたけ ながねぎ しんしょうが なまごめ みず だしこんぶ さけ うすくちしょうゆ みりん しお こぐちねぎ すだち みつば だいこんのおにおろし(ほそぎりおおばとあえると￮)"},{"id":"r0156","title":"お花太巻き","yield":"4切れ分","photo":"p/b4_p27_01.jpg","tags":{"ingredients":["ご飯","海苔","卵","チーカマ","ゆかり"],"season":["通年"],"category":["ご飯"]},"ingredients":[{"group":"","items":[{"name":"大判海苔","amount":"1枚（最後ノリで巻く場合は1と1/2枚）"},{"name":"ご飯","amount":"180g（実際使うのは160gです）"},{"name":"卵","amount":"L1個（真ん中をチーカマ、外側を海苔の場合は必要なし）"},{"name":"チーカマ","amount":"1本（真ん中を卵にする場合は不要）"},{"name":"ゆかり、たらこ、デンブなどお好きな色付け","amount":"適量"},{"name":"塩","amount":"ひとつまみ"}]}],"steps":[{"group":"","items":["ご飯は110gと70gに分け、110gの方にゆかりなどを入れて色付けをし、残りの70gに塩ひとつまみを混ぜる。（10gずつ多めに書いてます）","海苔を縦半分に切り、それぞれ横3等分にする。（6枚できます）","2の海苔5枚にそれぞれ20gの色付きご飯をのせ巻きすで巻き、形を整える。（ラップでもできます）","真ん中が卵の場合は薄焼き卵をくるくる巻き、残りの1枚のノリできつくまく。チーカマでも。","手のひらで巻きすを丸く持ち、3を3本並べ真ん中の上に4をのせ、残りの2本を上にのせて覆い花の形を作り巻きすでぎゅっとしておく。","薄焼き卵か縦半分の海苔の上に60gのご飯を奥1cmほど残して薄く広げる。","巻きすを広げ6の手前側の上に5をのせて巻く。","5分ほど置いてなじませたら濡れた包丁で4等分にする。（切る都度濡らす、力を入れず包丁の重みで切るときれいに切れます。）"]},{"group":"綺麗な薄焼き卵","items":["卵2個で大体2、3枚（卵、フライパンの大きさや薄さによる）。","卵をよく溶いたら同量の水でといた片栗粉小さじ1/2を入れ、濾す。","油を薄く塗ったフライパンに火をかけ十分に熱したら濡れ布巾に一度置きジュー！と表面の温度を冷ます。","再び火にかけ（中火）卵を流し入れたら全体に行き渡らせ余分な卵液は戻す。5秒したら火を止める。","15秒くらいすると周りが剥がれてくるので、熱くなければ指でつまみ（熱ければ菜箸を横一直線に入れて持つところですくい上げる）反対に返したら再び5秒火に掛けてとる。"]}],"tips":[],"y":"おはなふとまき ごはん のり たまご ちい 腐","白味噌","ねりごま"],"season":["冬"],"category":["副菜"]},"ingredients":[{"group":"","items":[{"name":"春菊","amount":"8本ほど"},{"name":"あんぽ柿","amount":"1個（普通の柿でも）"},{"name":"絹ごし豆腐","amount":"100g"},{"name":"白味噌","amount":"小さじ1.5"},{"name":"砂糖","amount":"小さじ1.5"},{"name":"薄口醤油","amount":"小さじ1"},{"name":"ねりごま","amount":"小さじ1"},{"name":"塩","amount":"小さじ1/4弱"},{"name":"氷水","amount":"適量"}]}],"steps":[{"group":"","items":["鍋に水（分量外）と豆腐を入れて7〜8分茹でる。ざるにあけて水気を拭いたらキッチンペーパーを3重に巻く。バットに豆腐を置き上にバットを乗せそこにしっかりとした重石をのせる（ペットボトルやお米など安定した物がよい）バットがなければ代用できるまな板やお皿など。1-2時間しっかり水分を出す。","沸騰したお湯に塩をいれ（大体1リットルに小さじ1）茎の方を入れて30秒、全体を入れて20〜30秒茹でたら氷水に入れて冷まし、キッチンペーパーでしっかりと水気を絞る。（春菊がしなしなしてる場合は一度水に浸けておき水分を戻してからするのがよい）3cmほどに切っておく。","あんぽ柿も同じ大きさに切っておく。","（ブレンダーを使うやり方）容器に1の豆腐を入れてブレンダーでよく混ぜて滑らかにさせる。調味料を全て入れてもう一度攪拌させる。","和え衣、春菊、あんぽ柿をよく混ぜて皿に盛る。"]}],"tips":["豆腐によって水切り後の残量が違うので、調味料を合わせておき、滑らかになった豆腐に2/3量ほど入れて味見するのがおすすめ！","☆ブレンダーがなければ濾し器やザルで濾してから材料とよく混ぜる。小さめの泡立て器を使って混ぜると〇","すり鉢がある人は練りごまを使わずいりごまをすり鉢でよくすってペースト状にして豆腐も入れてよくすり、調味料を最後に加えてする。","☆ねりごまの代わりにすりごまを代用できるが、滑らかさと風味が違う。（お好みでレシピにすりごまを少し入れても）","練りごまはバンバンジーや坦々麺やうどんなどもつけつゆなどにも使えるよ！","（手書きメモ）豆腐によって水分量が異なる？ので調味料は少なめから入れる（「絹ごし豆腐」から線が引いてある）","（手書きメモ）しっかりやる（「水切り」の下線を指している）","（手書きメモ）お湯 or レンジ（丸で囲み。作り方1の豆腐の下ゆでのこと）","（手書きメモ）お湯のときは水から入れる"],"y":"しゅんぎくとあんぽかきのなめらかしらあえ しゅんぎく あんぽかき きぬごしとうふ しろみそ ねりごま しゅんぎく あんぽかき きぬごしとうふ しろみそ さとう うすくちしょうゆ ねりごま しお こおりみず"},{"id":"r0166","title":"牡蠣の昆布焼き（牡蠣の下処理）","yield":"2人前","photo":"p/b4_p44_01.jpg","tags":{"ingredients":["牡蠣","昆布","小口葱","すだち"],"season":["冬"],"category":["温菜"]},"ingredients":[{"group":"","items":[{"name":"牡蠣","amount":"6個"},{"name":"昆布","amount":"牡蠣3個並べられる長さ 2枚"},{"name":"酒","amount":"大さじ2"},{"name":"小口葱","amount":"少々"},{"name":"塩","amount":"少々"},{"name":"紅葉卸し","amount":"適量"},{"name":"すだち","amount":"1/4個"}]},{"group":"下処理","items":[{"name":"片栗粉、塩","amount":"適量"}]}],"steps":[{"group":"下準備","items":["キッチンペーパーに酒を含ませ昆布を拭き、水分を含ませ柔らかくする。","牡蠣がかぶるくらいの片栗粉、塩小さじ1位、水少々を入れ指先で潰さないように混ぜる。灰汁がでてきて灰色になったら水で素早く洗い流す。"]},{"group":"作り方","items":["アルミホイルを長めに広げ昆布を敷き牡蠣 me":"蜂蜜","amount":"大さじ1"},{"name":"酒","amount":"大さじ1"}]}],"steps":[{"group":"","items":["スペアリブに切り込みを入れて蜂蜜と酒で揉み込んで室温に戻しておく（30分〜1時間）","鍋にオリーブオイルをひきスペアリブに全面焼き色を付ける。（焦げやすいので注意）","火を止めて一度取り出したらニンニクを余熱で軽く炒める。火をつけてセロリと玉ねぎのみじん切りを入れたら塩ひとつまみして炒め半透明になったら、玉ねぎすりおろしと☆、トマトペーストを入れる。","2を戻したら蓋をして1時間〜2時間弱火で煮込む。（1時間以上煮込む場合は1時間したら様子を見て煮詰まりすぎていたら水を少し（50ccほど）加える。）","ブルーベリージャム大さじ1/2とバルサミコ酢（あれば）を最後に入れて一煮立ちさせたら皿に盛りお好みで生クリームをかける"]}],"tips":["もしソースが水っぽければ小さい鍋などにうつし煮詰めてかける"],"y":"すぺありぶのぶるうべりいあかわいんにこみ すぺありぶ ぶるうべりいじゃむ あかわいん たまねぎ せろり すぺありぶ たまねぎ たまねぎ せろり にんにく とまとぺえすと おりいぶおいる あかわいん みず みりん うすたあそおす しょうゆ ぶるうべりいじゃむ ばるさみこす しあげようぶるうべりいじゃむ なまくりいむ はちみつ さけ"},{"id":"r0172","title":"天婦羅","yield":"","photo":null,"tags":{"ingredients":["薄力粉","卵","海老","野菜","米油"],"season":["通年"],"category":["温菜","揚げ物"]},"ingredients":[{"group":"衣","items":[{"name":"卵","amount":"1個"},{"name":"水","amount":"250cc（冷やしておく）"},{"name":"薄力粉","amount":"100g（ふるっておく）"},{"name":"片栗粉","amount":"大さじ3（お店で片栗粉は使わないが家だと食べるまでに時間がかかってしまうので入れます）"},{"name":"打ち粉用薄力粉","amount":"適量"},{"name":"冷やしておく氷水","amount":""},{"name":"揚げ油","amount":"適量（今回は米油（太白ごま油お勧め）とごま油）"}]},{"group":"道具","items":[{"name":"穴しゃくし、網しゃくし","amount":""}]},{"group":"天茶（2〜3杯分）","items":[{"name":"出汁","amount":"400cc"},{"name":"塩","amount":"小さじ1弱"},{"name":"薄口醤油","amount":"小さじ1"},{"name":"粉緑茶","amount":"小さじ1/2"},{"name":"ワサビ","amount":"適量"},{"name":"ご飯","amount":"茶碗1杯×2〜3"}]}],"steps":[{"group":"","items":["冷やしておいた水に卵を入れて白身からよく溶く。","ふるった薄力粉を3回に分けて混ぜる。泡立て器を使って混ぜる回数少なく。トントンする感じ。ある程度粉っぽさが残っていてOK。","氷水で2をボウルごと冷やしておく。","ポリ袋に素材を入れて打ち粉を少しだけ入れてふるったら衣につけて揚げる。（この方が薄くつくが粉をつけてもok。その場合は余分な粉はキチンと落とす）","厚めに切った根菜類は大体2.5〜3分ほど、大葉やししとうは衣が固まったらすぐ。そのほかの野菜は1.5〜2分ほど、エビなどは大きさによるが余熱で最後仕上げるイメージ。全て網の上で少し休ませる（余熱）。追い衣：野菜類は箸で数滴垂らし、海老は小さめのスプーンで垂らす。","かき揚げは4同様ポリ袋で打ち粉をつけたら衣に入れて穴しゃくしですくい余分な衣を落とす。（穴しゃくしがない場合は小さいボウルなどで衣をつける）","火を止めた油に鍋の縁を使って形を作るように軽くおさえながら揚げる。30秒ほどしたら火をつけてしっかり形が作れたらひっくり返して軽くあげればok。"]},{"group":"海老の下ごしらえ","items":["海老は尻尾の先を斜めに切り、包丁の背でしごくと水分が取れて油はね防止になります。","背ワタを取り除き腹の部分に斜めに3、4回切り込みを入れる。キッチンペーパーの上に腹を下にして置き上から押す感じでまっすぐ成形していく。水分はしっかりふく。"]},{"group":"天茶","items":["出汁を温めて塩・薄口醤油・粉緑茶で味をととのえ、ご飯に天ぷらをのせてかけ、ワサビを添える。"]}],"tips":["（天ぷらの基本・前ページ）＜家庭ではフライパンでok＞油は2.5〜3cmの深さで充分。（それでも意外と多いのでお箸などで量ってね）厚手で底がフラットなので全体の温度がほぼ同じに。衣が多いもの（かき揚げなど）は溢れる可能性もあるので深めのフライパンが◎。油の量が少ないため温度の変動に注意。","（天ぷらの基本・前ページ）薄力粉→ふるいにかける。1回で充分。直前でなくても袋に入れて冷蔵庫に入れておけばok。","（天ぷらの基本・前ページ）卵水→水は冷蔵庫で冷やしておくのが◯。水の中に卵を入れて混ぜる。卵白は卵黄に比べて溶きにくいが水に卵白の方が混ざりやすい。泡が立つほど卵白がよく混ざっている。沢山作るときは卵水は多めに作っておく（粉をつけてから衣につけるので濃くなっていく）。","（天ぷらの基本・前ページ）油→ごま油1：太白ごま油3。アクのある素材も油がアクを抜き色を保つ。自宅では米油＋ごま油がお勧め！熱酸化しづらい油がいいよ。","（天ぷらの基本・前ページ）＜衣＞1. 卵水をボウルに入れ粉を何回かに分けて加える。（粉に卵水を入れると混ざりにくい）2. 泡立て器を寝かせて8の字を書くように、粘り気が出ないようにざっくり。3. 浮いている粉はトントンと沈める。多少ダマが残って良い。4. 箸ですくうと衣が途切れず、すーっと流れ落ちる。薄くてok！素材をうっすら覆うだけ。タネの風味と色が生きる。（お好みで追い衣をしても）","（天ぷらの基本・前ページ）＜粉＞薄力粉で薄膜を作る。素材と衣との間に隙間が生まれ蒸し空間になる。衣が剥がれることを防ぐ、均一につける接着剤。揚げている間に素材から滲み出る水分を粉が吸い取ってくれカラっと仕上がる。注意点：厚くまぶすとダマになるので叩いて余分な粉を落とす。まとめてつけておくのはNG。素材の水分でベタついてしまう。","（天ぷらの基本・前ページ）＜油の温度＞170℃（野菜など）→衣は気泡を静かにたてながらそこまで沈んですぐにスーッと上がってくる。180℃（エビなどの魚介）→衣は落ちた瞬間に気泡をたてながらスッと沈み、底につくかつかないかまでしか沈まない。勢いよく気泡をたてながらすぐに浮き上がり油の表面にパッと散って広がる。190℃（アナゴなど）→衣を垂らした瞬間表面に細かい気泡が大量に立つ。軽い衣は沈まない。","（天ぷらの基本・前ページ）＜油②＞3〜4個同時に揚げることが多いので、10℃ほど下がりがち。揚げ始めは5〜10℃高い温度で入れる。かき揚げは高温だとバラバラになるので一度火を消して（弱めて）タネを入れてから30秒ほどして火をつける。","（天ぷらの基本・前ページ）＜揚げあがり＞泡→小さく沢山出ていた泡は大きく少なくなる。音→高い音から低い音になる。","（天ぷらの基本・前ページ）＜例＞椎茸は適温が170℃。1. 180℃の油に入れる 2. 170℃を保って揚げる。なるべく触らない、箸で掴むのではなくすくって裏返す感じ。3. 油を切る時は寝かせるよりたてて。","（手書きメモ・前ページ）厚めのフライパン","（手書きメモ・前ページ）たいはくごま油、米油","（手書きメモ・前ページ）素材 冷たいほうがカラッと仕上がる","（手書きメモ・前ページ）かきあげ―温度大事"],"y":"てんぷら はくりきこな たまご えび やさい べいゆ たまご みず はくりきこな かたくりこ うちこようはくりきこな ひやしておくこおりみず あげあぶら あなしゃくし、あみしゃくし だし しお うすくちしょうゆ こなりょくちゃ わさび ごはん"},{"id":"r0173","title":"蕪の器の茶碗蒸し","yield":"蕪4個分","photo":"p/b4_p52_01.jpg","tags":{"ingredients":["蕪","卵","鶏もも肉","椎茸","三つ葉"],"season":["冬"],"category":["温菜"]},"ingredients":[{"group":"","items":[{"name":"蕪","amount":"4個"},{"name":"具材（鶏モモ、蒲鉾、椎茸、三つ葉など）","amount":"なくても！"},{"name":"卵","amount":"1個"},{"name":"水","amount":"卵の重量の3倍（大体150〜160g）"},{"name":"白出汁","amount":"大さじ1"},{"name":"薄口醤油 amount":"8個"},{"name":"クローブ","amount":"5-6個"},{"name":"ブラックペッパー","amount":"小さじ1"},{"name":"シナモンスティック","amount":"3本"},{"name":"ベイリーフ","amount":"1枚"}]},{"group":"B","items":[{"name":"コリアンダー","amount":"大さじ1"},{"name":"ターメリック","amount":"山盛り小さじ1"},{"name":"チリパウダー","amount":"小さじ1.5"},{"name":"クミンパウダー","amount":"小さじ1.5"}]},{"group":"お好みで","items":[{"name":"extra hot curry paste","amount":"お好みで"},{"name":"グリーンピース","amount":"お好みで"}]}],"steps":[{"group":"","items":["熱したフライパンに多めの油（中火）を入れて、Aと生姜にんにくを入れて茶色く水気がなくなるまで炒める。","玉ねぎと塩小さじ1を入れてよく炒める。","弱火にしたらBを入れて軽く炒める。","中弱火にしてカットトマト缶1/3入れてよく炒める。","挽肉を入れて火を強め、水気を蒸発させる。（extra hot curry paste お好みで）","塩を小さじ1-2いれ、トマト缶残り2/3と水300ccほど（コップ2杯ほどと記載）。","ガラムマサラ大さじ1を入れてよく炒めて水気を飛ばす。","お好みでグリーンピース。"]}],"tips":["教えてもらったレシピをそのまま記載しています♪ 量が多いので、冷凍したり減らして作ってみてね！","関連の読み物：スパイスカレー資料 p5（スパイスのタイミング）、p4（スパイスカレーの基本の順番）、p3（マサラ・ガラムマサラ）、p7（玉ねぎの重要性）"],"y":"いんどのまだむままじきでんきいまかれえ ひきにく たまねぎ とまとかん しょうが にんにく ぐりいんぴいす ひきにく(あらっておく) たまねぎ(おおきめのみじんきり) しょうが(すりおろし) にんにく(すりおろし) かっととまとかん しお がらむまさら あぶら かるだもんのじつ(つめできずつける) くろおぶ ぶらっくぺっぱあ しなもんすてぃっく べいりいふ こりあんだあ たあめりっく ちりぱうだあ くみんぱうだあ えくすてら ほて くっるい ぱすて ぐりいんぴいす"}];
const READS = [{"id":"spice","title":"スパイスカレーの基本","lead":"スパイスの選び方・使う順番・玉ねぎの炒め方まで。お教室のカレーの回の資料です。","links":["r0195"],"sections":[{"h":"スパイスについて","html":"\u003cp>スパイスとは植物の一部（種子・実・樹皮・根・葉など）を乾燥させたり粉にして料理や飲み物に香り・辛味・色・風味をつけるもの\u003c/p>\u003cp>\u003cb>役割\u003c/b>\u003c/p>\u003cp>1.香り付け　2. 辛味付け　3. 色付け　4. 保存性の向上　5. 消化を助ける・薬効\u003c/p>\u003cp>5に記載の通り、スパイスは昔から食べる薬として使われてきて医学的な研究もされている。\u003cbr>スパイスには漢方薬の成分として配合されているものが多い。\u003cbr>つまりスパイスは料理の味を整える調味料でもあると同時に『体を整える薬』でもある。\u003cbr>これは\u003cb>＜医食同源＞\u003c/b>の考え方に通じます。\u003cbr>医食同源とは\u003cb>食べ物と薬の源（もと）は同じであり、日常の食事こそが健康を守る基本\u003c/b>という考え方。\u003c/p>\u003cp>1. 毎日の食事が体調を整える\u003cbr>　→ 病気になってから薬を飲むのではなく、普段から食で予防する\u003cbr>2. 旬の食材や自然の恵みを取り入れる\u003cbr>　→ 季節に合った食材は、体の調子を整えやすい\u003cbr>3. 薬効のある食材・スパイスを上手に活かす\u003cbr>　→ ショウガで冷えを防ぐ、ニンニクで抗菌、ターメリックで抗炎症など\u003c/p>\u003cp>1.2はスパイス関係なく、普段の料理でも意識するといいね♪\u003cbr>3に関して掘っていくと…\u003cbr>実際、太田胃散に含まれる生薬の多くはスパイスとしても知られ、その香り成分が胃の働きを高める一助となっています。スパイスのブレンド＝ガラムマサラのお薬用版と言える！\u003cbr>公式情報によると、太田胃散（粉タイプ／分包）の1回分（約1.3 g）には、以下のような「香り豊かな胃腸薬としての生薬」が配合されているよ。\u003c/p>\u003cul>\u003cli>ケイヒ（桂皮・シナモン）…92 mg\u003c/li>\u003cli>ウイキョウ（茴香・フェンネル）…24 mg\u003c/li>\u003cli>ニクズク（肉荳蔲・ナツメグ）…20 mg\u003c/li>\u003cli>チョウジ（丁子・クローブ）…12 mg\u003c/li>\u003cli>陳皮（ミカンの皮を乾燥したもの）…22 mg\u003c/li>\u003cli>ゲンチアナ（苦味を持つ生薬）…15 mg\u003c/li>\u003cli>ニガキ末（苦味を持つ木の皮）…15 mg\u003c/li>\u003c/ul>\u003cp>公式サイトにも「七種の健胃生薬」として、以下の内訳が紹介されている！\u003c/p>\u003cul>\u003cli>シナモン（桂皮）92 mg\u003c/li>\u003cli>フェンネル（ウイキョウ）24 mg\u003c/li>\u003cli>ナツメグ（ニクズク）20 mg\u003c/li>\u003cli>クローブ（チョウジ）12 mg\u003c/li>\u003cli>みかんの皮（陳皮）22 mg\u003c/li>\u003cli>ゲンチアナ 15 mg\u003c/li>\u003cli>ピクラスマ（苦木）15 mg\u003c/li>\u003c/ul>\u003cp>スパイスの効能を意識しておけば、自分や大切な人の体調に合わせて配合を変えられる。\u003cbr>例えば…\u003c/p>\u003cp>クローブ（丁子）・強い抗酸化作用を持ち胃痛や腹痛、喉・歯の痛みなどに用いられる\u003cbr>シナモン（桂皮）・胃腸を温めて消化機能を高めるほか、冷え性や下痢、月経痛の緩和\u003cbr>ターメリック（ウコン）・肝臓の機能を助け健胃作用や抗炎症作用、認知症予防への効果も\u003cbr>クミン・胃の薬としても使われ、食欲増進、消化促進、胃腸の働きを整える効果\u003cbr>コリアンダー・抗酸化作用。体内に溜まった有害な重金属を体外へ排出するデトックス効果\u003cbr>フェンネル・（ウイキョウ）消化を助けてくれるのでインド料理屋さんで最後にもらえることも多々。大正漢方胃腸薬にも入っている（シナモンも入ってるよ）\u003cbr>カルダモン・脳の血流を増加させる・\u003cbr>ナツメグ・胃の冷えや腹痛、胸焼け、食欲不振や胃もたれ。下痢に（安中散に入ってる）\u003cbr>　　注意点⚠摂りすぎは危険（幻覚・頭痛・吐き気など中毒症状）安全な量は～小1/4\u003cbr>　　妊娠中の大量摂取はNG（子宮収縮作用の報告あり）\u003c/p>\u003cp>他にも調べてみるとたくさん！\u003cbr>今日はここが調子悪いから、このスパイスを多めに使おうとか、おうどんに少し入れてみよう、とか体のことを思って配合できるとまた日常が豊かになるね。\u003c/p>"},{"h":"スパイスの使い方と保存方法","html":"\u003cul>\u003cli>\u003cb>軽く手で揉む、潰す、傷つける\u003c/b>\u003c/li>\u003c/ul>\u003cp>  タイムやオレガノ、ローズマリーなどの葉や茎のスパイス（ハーブ）は投入する際手で軽く揉むと手の熱と摩擦で香りが立ちやすくなる。\u003cbr>  マスタードシード、カルダモン、コリアンダーシードなどの種は（用途によるが）潰すと香りが立ちやすく、キャラウェイシードはそのまま食べる際手で揉むとふわっと柔らかい香りになる。\u003c/p>\u003cul>\u003cli>\u003cb>油は軽く温めた方が良い\u003c/b>\u003c/li>\u003c/ul>\u003cp>  油にスパイスの香りを移すときは予め油を温めておく。冷たいまま投入すると油を吸って香りが移りづらい。また熱しすぎると焦げて苦味がでるので注意。スパイスを投入した際にシュワっと泡立つくらいに温めておく。\u003c/p>\u003cul>\u003cli>\u003cb>冷暗所に保存\u003c/b>\u003c/li>\u003c/ul>\u003cp>  スパイスは乾燥しているため日持ちします。しかし退色するものも多いため直射日光はもちろんキッチンに出しっぱなしにせず冷暗所に。ターメリックやパセリなどは退色しやすいので注意。スパイスによっては冷蔵保存をおすすめしているものもある。\u003cbr>  私はマサラケースに入れて冷蔵保存しています！\u003c/p>"},{"h":"日本のカレーとスパイスカレー","html":"\u003cp>・日本のカレーは油小麦粉でカレー粉を固めているのでカロリーや脂質が多い！\u003cbr>　添加物や化学調味料も入っていることが多い。\u003cbr>・スパイスカレーは造語で、インドカレーやスリランカカレーだってスパイスを使うカレー。基本スパイス＋塩のみ。ここに出汁やストック、隠し味など入ってくると大阪発祥のスパイスカレーになってくる。何を入れてもいいよとっても自由！！！\u003c/p>\u003cp>日本のカレー　＝安心感・定番・家庭の味、\u003cbr>スパイスカレー＝香りや効能を楽しむ自由な料理\u003c/p>\u003cp>スパイスカレーは__カレーを食べる__、ではなく__食材をスパイスの香りでいただく__、という感じだから！具材とベースを変えるだけでレパートリーは無限大∞！\u003cbr>\u003cb>スパイスは一緒でも全く違う味になる\u003c/b>←スパイスは味ではなく香り\u003cbr>次ページに出てくる最低限のスパイスのみでも様々なスパイスカレーができます。\u003cbr>（ベース（p.4参考）のチョイスでも味や風味が変わる）\u003cbr>カレーを食べる、ではなくこの具材を食べたいという素材ベース\u003c/p>"},{"h":"玉ねぎの重要性","html":"\u003cp>玉ねぎは必ずと言っていいほど使う！\u003cbr>大きく切った方が旨味や甘味が出る。切れば切るほど繊維が潰れて苦味が出やすい。\u003cbr>（例えば、バーベキューの時とかの玉ねぎ丸ごとホイル焼き、めっちゃ甘いよね）\u003cbr>大きい方が溶けやすく（時間がかかる）小さいと残りやすい（具っぽいカレーに）\u003cbr>みじん切りだったら粗微塵がおすすめ！某有名カレーの古い本にもこちらの記載が。\u003c/p>\u003cp>__一般的にはみじん切りで作ります。←あら微塵がいいね！__\u003cspan class=\"hand\">✎ 星印\u003c/span>\u003cbr>__時間に余裕があり甘味やうま味を足したい場合にこの方法で__\u003cbr>\u003cb>→水で煮てから炒める\u003c/b>こうすることで時短にて甘味を引き出せる。\u003cbr>順番は\u003cb>少なめの水で煮る→柔らかくなり水がなくなる→油とスパイス→いつもの工程\u003c/b>\u003cbr>↑くし形が○　その後に炒める工程で粗微塵やすりおろしを入れるのも好き　\u003cspan class=\"hand\">✎ 星印と下線\u003c/span>\u003cbr>みじん切りの炒め具合（焦げ具合）でも味が変わる\u003c/p>\u003cp>そのときの気分や好み、メインによって色々変えて♪\u003c/p>\u003cp>\u003cspan class=\"hand\">✎ 10分蒸す（「みじん切り」の行あたりから線が引かれている）\u003c/span>\u003c/p>"},{"h":"スパイスカレー","html":"\u003cp>基本は\u003cb>＜具材×ベース×スパイス＞\u003c/b>＋塩　のみ。\u003cbr>__塩はとても重要！__(入れるタイミングは2.3回)最後に味見をして少し足してね。\u003cbr>あれ？物足りない？と思っても最後の一振りでグッと美味しくなる。\u003cbr>1野菜を炒める際（時短）2パウダースパイスの時 3最後の味見で必要だったら\u003cbr>の2-3回のタイミングで入れるよ！\u003c/p>"},{"h":"最初は最低限のスパイスで充分","html":"\u003cp>・\u003cb>クミンパウダー・コリアンダーパウダー・ターメリックパウダー\u003c/b>　\u003cspan class=\"hand\">✎ 星印と下線\u003c/span>\u003cbr>この3つがあれば最低限ok！\u003cbr>・クミン（カレーらしい香り、入れるだけでカレーっぽく）\u003cbr>・コリアンダー（爽やかな香りで個性がある、スパイスをまとめてくれる）\u003cbr>・ターメリック（土のような香り、入れすぎると臭みになるので注意。入れないと深みが出ない。色付け効果も）\u003cbr>＋お好みで辛みパウダー（チリやブラックペッパー、カイエンなど）\u003c/p>\u003cp>この後はカルダモン、クローブ…\u003cbr>個人的にオールスパイスもおすすめ！一つでクローブ、ナツメグ、シナモンの香りがするので奥行きが出ます。\u003c/p>\u003cp>ホールスパイスの最初にゲットすべきもの\u003cbr>・カルダモン・クローブ・シナモン\u003cbr>・クミンシード・マスタードシード・フェネグリークシード\u003cbr>（↑短時間で香りが引き立つ）\u003cbr>ちなみに私的にクミンシードは欠かせない！！ドレッシングやラペ、アチャールなど色んな料理の香り付にも重宝するので最初にゲットして欲しい♪その後カルダモン、クローブあたりがいいかな\u003c/p>\u003cp>\u003cspan class=\"hand\">✎ たまねぎ　刃を入れすぎると　甘みが減るので　あらみじん切り\u003c/span>\u003c/p>"},{"h":"スパイスカレーを作るときの考え方 and 順番","html":"\u003cp>1.　＜具材＞　肉・魚・野菜・豆etc　（1～2種類）\u003cbr>　　　×\u003cbr>2.　＜ベース＞水・牛乳・ヨーグルト・ココナッツミルク・生クリーム etc\u003cbr>　　あっさり ⟷ こってり\u003cbr>　　ホールなし・野菜 ／ ホール3つ以上・肉魚\u003cbr>3.　＜スパイス＞\u003c/p>\u003cp>基本的に使うもの\u003cbr>○玉ねぎ・（トマト）・にんにく・生姜\u003cbr>○スパイス\u003cbr>○塩・油\u003c/p>\u003cp>旬の食材や気分の食材で具材本来の味をメインに楽しめる！\u003cbr>（日本のカレーはあのカレーの味がメインになっちゃうよね）\u003c/p>"},{"h":"スパイスのタイミング","html":"\u003cp>__大まかに3タイミング！__\u003c/p>\u003cp>\u003cb>1. スタータースパイス　2. パウダースパイス　3. 仕上げテンパリング\u003c/b>　\u003cspan class=\"hand\">✎ （3に下線を引いて）あまりやらなくてよい\u003c/span>\u003c/p>\u003cp>1→ 具材を炒める前に油に香りづけ。主にシードのまま。\u003cbr>　　カルダモン・クローブ（粒がぷくっとひとつまみ）\u003cbr>　　シナモン。スターアニス(濃い茶色 30秒-1分)\u003cbr>　　クミンシード(シュワシュワ泡立つ)\u003cbr>　　ベイリーフ　（焦げやすいので次の工程の10秒まえ）\u003cbr>2→トマト・スパイス←先に入れたほうが立つ（トマトの旨味 or スパイスの香り）\u003cbr>3→仕上げの香り\u003cbr>　熱い油で短時間抽出。油ごとカレーにかけて香りづけ。別の小さい鍋で。\u003cbr>　（香りが飛びやすいスパイスを使うため食べる直前に行う）\u003c/p>\u003cp>__テンパリング順番__\u003cbr>マスタードシード→(強火出ていると跳ねるので油にしっかりつけて、軽くぱちっとしてきたら）フェグリーク（ごく弱火）→フェンネル・チリホール・クミンシード→（マスタードが8割跳ねて浮いてきたら）→ヒング→すぐに（フェンネルやクミンが泡を立てて浮いてきたら）→カレーリーフ（1.2秒）\u003cbr>目安はこの間にマスタードシードがはじけ終わればok\u003c/p>\u003cp>☆煮る必要があるもの（スターターとして炒めた後最後までにこむ）\u003cbr>\u003cb>・ブラウンカルダモン・シナモン・ベイリーフ・スターアニス・クローブ\u003c/b>\u003cbr>高音の油で熱しても一度に全ての香りが引き出せず、じっくり煮ることで立ってくる深い香りがある。（骨付きカレー、豆、米料理などで使うテクニック）\u003c/p>\u003cp>ガラムマサラは加熱中に失われた香りを補うもの\u003cbr>・辛みや色付けのものは基本入れない（辛みは好みなので入っているものもある！）\u003cbr>・好きな香りを引き立たせても\u003cbr>なので自分で好きな香りを多めに調合とかもできるよ！\u003cbr>日本のカレーの仕上げや、他の料理の香りづけなどにも使える\u003c/p>"},{"h":"スパイスカレーの基本の順番","html":"\u003cp>スパイスカレーを作るときには基本的な手順があります。\u003cbr>「香りを加える」プロセスと「味を加える」プロセスを交互に繰り返す。\u003cbr>（まず最初は☆下ごしらえ、マリネ・食材カット・すりおろしなど）\u003cbr>これを終わらせておくとかなりスムーズ！\u003c/p>\u003cp>① 香・初めの香り　→スタータースパイス\u003cbr>② 味・ベース　　　→玉ねぎ、生姜、にんにく\u003cbr>　 味・旨味　　　　→トマト\u003cbr>③ 香・中心の香り　→パウダースパイス　\u003cspan class=\"hand\">✎ しっかり炒める\u003c/span>\u003cbr>④ 味・水分　　　　→水、ヨーグルト、ココナッツ etc\u003cbr>⑤ 味・具　　　　　→肉、魚、野菜、豆 etc\u003cbr>⑥ 香・仕上げの香り→テンパリングやパクチー\u003c/p>\u003cp>__☆香→味→香→味→香☆__\u003c/p>\u003cp>スパイスは①③⑥の3タイミングと覚えておくと○\u003cbr>p.3記載の塩のタイミングは②③必要なら⑥\u003c/p>"},{"h":"マサラ","html":"\u003cp>マサラとは複数のスパイスが混ざったもの、家庭それぞれの配合がある。\u003c/p>\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>\u003cb>チャットマサラ\u003c/b> チャット→スナック・軽食／香り強く酸味と辛味が特徴\u003c/th>\u003cth>\u003cb>ガラムマサラ\u003c/b> ガラム→温かい・熱い／体を温める\u003c/th>\u003c/tr>\u003ctr>\u003ctd>使い方\u003c/td>\u003ctd>スナックやサラダの仕上げに振りかける\u003c/td>\u003ctd>料理中や仕上げに使う\u003c/td>\u003c/tr>\u003ctr>\u003ctd>味の特徴\u003c/td>\u003ctd>酸味・塩味・刺激的\u003c/td>\u003ctd>香り高く、温かみのある風味\u003c/td>\u003c/tr>\u003ctr>\u003ctd>代表スパイス\u003c/td>\u003ctd>アムチュール、ザクロ、ブラックソルト\u003c/td>\u003ctd>シナモン、クローブ、ナツメグ\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"tbl\">\u003ctable>\u003ctr>\u003cth>マサラ\u003c/th>\u003cth>使う料理\u003c/th>\u003cth>特徴\u003c/th>\u003c/tr>\u003ctr>\u003ctd>ガラムマサラ\u003c/td>\u003ctd>ほぼすべてのインド料理\u003c/td>\u003ctd>香り重視、体を温める\u003c/td>\u003c/tr>\u003ctr>\u003ctd>チャットマサラ\u003c/td>\u003ctd>スナック・サラダ\u003c/td>\u003ctd>酸味・塩味が強い、爽やか\u003c/td>\u003c/tr>\u003ctr>\u003ctd>カレーマサラ\u003c/td>\u003ctd>カレー用全般\u003c/td>\u003ctd>コクと深みを出す\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ティー（チャイ）マサラ\u003c/td>\u003ctd>ミルクティー（チャイ）\u003c/td>\u003ctd>甘い香り。シナモン・カルダモンなど\u003c/td>\u003c/tr>\u003ctr>\u003ctd>タンドリーマサラ\u003c/td>\u003ctd>タンドリーチキンなど\u003c/td>\u003ctd>パプリカ色でスモーキーヨーグルトに混ぜる\u003c/td>\u003c/tr>\u003ctr>\u003ctd>キッチリーマサラ\u003c/td>\u003ctd>キチュリ（豆と米の炊き込み）\u003c/td>\u003ctd>やさしい香り、軽い味付け\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ビリヤニマサラ\u003c/td>\u003ctd>ビリヤニ（炊き込みご飯）\u003c/td>\u003ctd>強めの香りで重厚感あり\u003c/td>\u003c/tr>\u003ctr>\u003ctd>サンバルマサラ\u003c/td>\u003ctd>サンバル（南インドのスープ）\u003c/td>\u003ctd>酸味・辛味・だしの風味\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cp>（※2つ目の表の見出し「マサラ／使う料理／特徴」は、原本に見出し行がないため書き起こし側で付けたものです）\u003c/p>\u003cp>今回みんなに渡したガラムマサラはクミン・コリアンダー・ブラックペッパー・カルダモン・クローブ・シナモン・ベイリーフ・フェンネル・スターアニス・ジンジャーが入ってるよ！\u003cbr>乾煎りして冷まして粉砕するだけでできるから、自分の好きな香りで作れちゃう♪6種類とかでも○\u003c/p>"},{"h":"リーフ系","html":"\u003cp>__カレーリーフ__・南インドやスリランカで必須。油に入れると香りが移り、爽やかで独特な風味に。日本では冷凍や乾燥が入手可。\u003cbr>__コリアンダーリーフ（パクチー）__・仕上げの香味野菜。タネのコリアンダーとは全然違う柑橘っぽい清涼感。\u003cbr>__ミントリーフ__・チャトニやライタに使うことが多いけど、カレーの仕上げや副菜にも◎。\u003cbr>__フェヌグリークリーフ（カスリメティ）__・乾燥葉。バターチキンなど北インドのリッチなカレーに最後に加えると甘苦い香りが深まる。\u003c/p>\u003cp>\u003cb>その他よく使われるリーフ（インド以外も）\u003c/b>\u003cbr>__ベイリーフ（ローリエ）__・北インドやヨーロッパ風のカレーで。煮込みに使うと香りが穏やかに広がる。\u003cbr>__パンダンリーフ__・スリランカや東南アジアで。甘い草のような香りを出す。\u003cbr>__タイバジル__・タイカレー寄りになるけど、爽やかな香りがアクセントに。\u003c/p>\u003cp>まとめると：\u003c/p>\u003cul>\u003cli>南インド／スリランカ系 → カレーリーフ必須\u003c/li>\u003cli>北インド系 → ベイリーフ＋カスリメティ\u003c/li>\u003cli>仕上げや副菜 → コリアンダーリーフ、ミント\u003c/li>\u003c/ul>\u003cp>カレーに合わせて「どのリーフを選ぶか」で印象がかなり変わる！\u003cbr>カレーリーフは持ってると一気に本格的。パクチーならすぐ手に入るね\u003c/p>"},{"h":"スパイスカレーの副菜","html":"\u003cp>スパイスカレーは副菜と一緒に食べることで完成する料理と言っても過言ではない！\u003c/p>\u003cp>＜副菜の役割＞\u003cbr>味のバランス：辛い・酸っぱい・甘い・香ばしいを一皿で調和させる\u003cbr>消化を助ける：ヨーグルトやスパイスの効果\u003cbr>食感の変化：カレー（柔らかい）＋副菜（シャキシャキ、カリカリ）\u003cbr>見た目：カレーは基本茶色人参や紫キャベツなどの彩りを加えると一気に華やかに！\u003c/p>\u003cp>\u003cb>アチャール（Achar / ピクルス）\u003c/b>\u003c/p>\u003cul>\u003cli>スパイスで漬けた漬物\u003c/li>\u003cli>マンゴー、ニンジン、大根、キャベツ、レモンなど\u003c/li>\u003cli>塩気と酸味で味に変化をつける\u003c/li>\u003c/ul>\u003cp>\u003cb>サブジ（Subzi / Sabzi）\u003c/b>\u003c/p>\u003cul>\u003cli>野菜をスパイスで炒め煮したおかず\u003c/li>\u003cli>キャベツ、カリフラワー、オクラ、ナスなど\u003c/li>\u003cli>クミンやマスタードシードでシンプルに味付け\u003c/li>\u003c/ul>\u003cp>\u003cb>ポリヤル（Poriyal / 南インド）\u003c/b>\u003c/p>\u003cul>\u003cli>ココナッツとマスタードシードで炒めた野菜料理\u003c/li>\u003cli>ニンジン、インゲン、キャベツなどが定番\u003c/li>\u003c/ul>\u003cp>\u003cb>ダール（Dal）\u003c/b>\u003c/p>\u003cul>\u003cli>豆のカレー（副菜として添えることが多い）\u003c/li>\u003cli>レンズ豆やムング豆などを煮てスパイスで香りづけ\u003c/li>\u003c/ul>\u003cp>\u003cb>ライタ（Raita）\u003c/b>\u003c/p>\u003cul>\u003cli>ヨーグルトに野菜やハーブを混ぜたもの\u003c/li>\u003cli>キュウリや玉ねぎ入りが定番\u003c/li>\u003cli>カレーの辛さを和らげ、消化を助ける\u003c/li>\u003c/ul>\u003cp>\u003cb>パパド（Papad）\u003c/b>\u003c/p>\u003cul>\u003cli>豆粉で作った薄いせんべいのようなもの\u003c/li>\u003cli>香ばしさと食感のアクセント\u003c/li>\u003c/ul>\u003cp>\u003cb>サラダや炒め物\u003c/b>\u003c/p>\u003cul>\u003cli>生の玉ねぎスライスにレモンと塩 → インド定番の副菜\u003c/li>\u003cli>ココナッツチャトニ（南インド）やミントチャトニ（北インド）なども添える\u003c/li>\u003c/ul>\u003cp>アチャールやサブシは定番で、添えることをおすすめ！\u003cbr>スパイスシードを使ったものからパウダーを和えるだけで簡単に作れるものもあるので面倒だったら...\u003cbr>アチャール・野菜を塩もみして水分を絞りお酢や調味料、スパイスで和えるだけでok!\u003cbr>サブシ・スパイスと塩で炒めればok!（ポリヤルになるとココナッツが必要）\u003c/p>\u003cp>レシピ「インドのマダムまま直伝キーマカレー」→ p01_01.json に入れました（読み物ではないのでここには書いていません）。\u003c/p>"}]}];
const LOCK = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEYNAME = "recipe-keys-" + (LOCK ? LOCK.salt.slice(0, 8) : "none");
let KEYS = {}; try { KEYS = JSON.parse(localStorage.getItem(KEYNAME) || "{}"); } catch (e) {}
const normPass = p => p.normalize("NFKC").replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/[\s\u3000\-－・]/g, "").toLowerCase();
async function unlock(pass) {
  const salt = b64(LOCK.salt), base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normPass(pass)), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: LOCK.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  for (const bx of LOCK.boxes) { try { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(bx.iv) }, k, b64(bx.ct)); const got = JSON.parse(new TextDecoder().decode(pt)).books; Object.assign(KEYS, got); try { localStorage.setItem(KEYNAME, JSON.stringify(KEYS)); } catch (e) {} return Object.keys(got); } catch (e) {} }
  return null;
}
async function openItem(id, book) {
  if (!LOCK || !KEYS[book] || !LOCK.items[id]) return null;
  const k = await crypto.subtle.importKey("raw", b64(KEYS[book]), "AES-GCM", false, ["decrypt"]);
  const it = LOCK.items[id]; return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(it.iv) }, k, b64(it.ct))));
}
const has = b => !!KEYS[b];
const DEMO = R.some(r => r.locked);
const GENRES = ["ご飯・麺","汁物・スープ","主菜","揚げ物","前菜・冷菜","副菜・小鉢","常備菜"];
const BOOKS = ["春","夏","秋冬","通年"];
const PRICE = {"春":"1,280円","夏":"1,280円","秋冬":"1,280円"};
const YEAR = "<s>2,980円</s> 1,980円";
const genreOf = r => { const c = (r.tags && r.tags.category) || [];
  if (c.includes("ご飯") || c.includes("麺")) return "ご飯・麺";
  if (c.includes("汁物")) return "汁物・スープ";
  if (c.includes("揚げ物")) return "揚げ物";
  if (c.includes("主菜")) return "主菜";
  if (c.includes("常備菜")) return "常備菜";
  if (c.includes("前菜") || c.includes("冷菜")) return "前菜・冷菜";
  return "副菜・小鉢"; };
const bookOf = r => { const s = ((r.tags && r.tags.season) || []).map(x => x === "初夏" ? "夏" : x);
  if (s.includes("秋") || s.includes("冬")) return "秋冬";
  if (s.includes("春")) return "春";
  if (s.includes("夏")) return "夏";
  return "通年"; };
R.forEach(r => { r.g = genreOf(r); r.b = bookOf(r); });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = (s, q) => { s = esc(s); return q ? s.split(esc(q)).join("<mark>" + esc(q) + "</mark>") : s; };

  if (DEMO) hits.sort((x, y) => (x.locked ? 1 : 0) - (y.locked ? 1 : 0));
  const groups = (genre === "すべて" ? GENRES : [genre]).map(g => [g, hits.filter(r => r.g === g)]).filter(([, L]) => L.length);
  let html = groups.map(([g, L]) => `<section><h2>${g}<small>${L.length}品</small></h2><div class="grid">${L.map(r => card(r, q)).join("")}</div></section>`).join("");
  if (terms.length > 1 && !hits.length && part.length) html = `<p class="empty" style="padding:16px 0 0">「${terms.map(esc).join("」と「")}」を全部使う料理はありませんでした。</p>`;
  if (part.length) html += `<section><h2>${terms.map(esc).join("・")}のどれかを使う<small>${part.length}品</small></h2><div class="grid">${part.map(r => card(r, q)).join("")}</div></section>`;
  $("#list").innerHTML = html || `<p class="empty">「${esc(q)}」に合う料理は見つかりませんでした。<br>別の材料や料理名で探してみてください。</p>`;
}
$("#list").onclick = e => { const rc = e.target.closest(".readcard"); if (rc) return openRead(rc.dataset.read, true); const b = e.target.closest(".item"); if (b) open(b.dataset.id, true); };
$("#q").oninput = draw;
async function open(id, push) {
  let r = R.find(x => x.id === id); if (!r) return;
  if (r.locked && has(r.b)) { try { const full = await openItem(r.id, r.b); if (full) r = { ...r, steps: full.steps, tips: full.tips, locked: false }; } catch (e) {} }
  let k = 0;
  const ing = (r.ingredients||[]).map(g => (g.group ? `<h4>${esc(g.group)}</h4>` : "") + `<ul class="ing">${(g.items||[]).map(i => `<li><span>${esc(i.name)}</span><i></i><span>${esc(i.amount||"")}</span></li>`).join("")}</ul>`).join("");
  const st = (r.steps||[]).map(g => (g.group ? `<h4>${esc(g.group)}</h4>` : "") + `<ol class="steps" style="--start:${k}">${(g.items||[]).map(s => (k++, `<li>${esc(s)}</li>`)).join("")}</ol>`).join("");
  $("#detail").innerHTML = `<div class="dbar"><button class="back" id="back">← もどる</button><span class="count">${esc(r.g)}・${esc(r.b)}</span></div>
    <article class="dbody">${r.photo ? `<img class="photo" src="${esc(r.photo)}" alt="${esc(r.title)}">` : ""}
    <h2>${esc(r.title)}</h2>
    <div class="meta">${(r.tags?.ingredients||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    ${r.yield ? `<div class="yield">分量：${esc(r.yield)}</div>` : ""}
    <h3>材料</h3>${ing}<h3>作り方</h3>${st}
    ${READS.filter(x => x.links.includes(r.id)).map(x => `<h3>資料</h3><button class="doc" id="go-${x.id}" data-read="${x.id}"><span class="ic">📄</span><span><b>${esc(x.title)}</b><small>${esc(x.lead)}</small></span></button>`).join("")}
    ${r.locked ? PAY(r) : ""}
    ${!r.locked && (r.tips||[]).length ? `<h3>先生のコツ・メモ</h3><div class="tips"><ul>${r.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    <div class="src">No.${esc(r.id.slice(1))}</div></article>`;
  $("#detail").hidden = false; $("#detail").scrollTop = 0; document.body.style.overflow = "hidden";
  $("#back").onclick = () => history.length > 1 && location.hash ? history.back() : close();
  $("#detail").querySelectorAll(".doc").forEach(b => b.onclick = () => openRead(b.dataset.read, true));
  if (push) history.pushState(null, "", "#" + id);
}
async function openRead(id, push) {
  let x = READS.find(y => y.id === id); if (!x) return;
  if (x.locked && has("通年")) { try { const full = await openItem("read-" + x.id, "通年"); if (full) x = { ...x, sections: full.sections, locked: false }; } catch (e) {} }
  const recipes = R.filter(r => x.links.includes(r.id));
  $("#detail").innerHTML = `<div class="dbar"><button class="back" id="back">← もどる</button><span class="count">資料</span></div>
    <article class="dbody article"><h2>${esc(x.title)}</h2><p class="lead">${esc(x.lead)}</p>
    ${x.sections.map(sc => `<h3>${esc(sc.h)}</h3>${sc.html}`).join("")}
    ${x.locked ? `<div class="pay"><b>続きはレシピ帖で読めます</b><span class="sub">この資料（全${x.total}項目）は会員になると読めます</span><div class="plans"><div class="best"><span>レシピ帖 会員</span><span class="c">${R.length}品＋毎月5品</span><span class="p">月680円</span></div></div><button type="button" disabled>会員になる（準備中）</button><small>見本のため、このボタンはまだ動きません</small><button class="haskey" type="button" onclick="openUl()">会員の方はこちら（合言葉を入れる）</button></div>` : ""}
    ${recipes.map(r => `<button class="golink" data-id="${r.id}">← ${esc(r.title)}に戻る</button>`).join("")}</article>`;
  $("#detail").hidden = false; $("#detail").scrollTop = 0; document.body.style.overflow = "hidden";
  $("#back").onclick = () => history.length > 1 && location.hash ? history.back() : close();
  $("#detail").querySelectorAll(".golink[data-id]").forEach(b => b.onclick = () => open(b.dataset.id, true));
  if (push) history.pushState(null, "", "#read-" + id);
}

function close() { $("#detail").hidden = true; document.body.style.overflow = ""; }
const route = h => h.startsWith("read-") ? openRead(h.slice(5), false) : open(h, false);
window.addEventListener("popstate", () => { const id = location.hash.slice(1); id ? route(id) : close(); });
chips(); draw();
if (location.hash.length > 1) route(location.hash.slice(1));

// 表紙の花びら（止まった絵として描く。動きを減らす設定なら動かさない）
(function petals(){
  const c = $("#petals"), x = c.getContext("2d"); if (!x) return;
  const css = getComputedStyle(document.documentElement);
  const col = [css.getPropertyValue("--rose").trim() || "#E9A3B6", css.getPropertyValue("--pale").trim() || "#F8E1E7"];
  let W, H, P;
  const size = () => { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); };
  const seed = () => { P = Array.from({length: 14}, (_, i) => ({ x: (i * 97) % 100 / 100 * W, y: (i * 53) % 100 / 100 * H, r: 5 + (i % 4) * 2, a: i, v: .15 + (i % 5) * .05, c: col[i % 2] })); };
  const petal = p => { x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = .55; x.fillStyle = p.c;
    x.beginPath(); x.moveTo(0, -p.r); x.quadraticCurveTo(p.r, 0, 0, p.r); x.quadraticCurveTo(-p.r, 0, 0, -p.r); x.fill(); x.restore(); };
  const frame = () => { x.clearRect(0, 0, W, H); P.forEach(petal); };
  size(); seed(); frame();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const tick = () => { P.forEach(p => { p.y += p.v; p.x += Math.sin(p.a) * .2; p.a += .004; if (p.y > H + 10) p.y = -10; }); frame(); requestAnimationFrame(tick); };
  addEventListener("resize", () => { size(); seed(); frame(); });
  requestAnimationFrame(tick);
})();
</script>
