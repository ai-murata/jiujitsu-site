  <g transform="translate(0 4200) rotate(-90)">
    <text x="2100" y="350" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="260" fill="#fff" letter-spacing="8">SILENCE SWITCH: GRAB HERE STRONGLY</text>
    <text x="2100" y="680" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="230" fill="#fff" letter-spacing="20">ここを強く掴むと黙ります</text>
  </g>
