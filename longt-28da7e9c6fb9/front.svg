<svg xmlns="http://www.w3.org/2000/svg" width="280mm" height="350mm" viewBox="0 0 2800 3500">
  <!-- ロンT フロント（胸中央）280×350mm / 1unit = 0.1mm / インク：白（イラスト部のみフルカラー） -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Oswald:wght@600&amp;display=block');
    .anton { font-family: Anton, Impact, "Helvetica Neue", sans-serif; }
    .oswald { font-family: Oswald, "Futura", "Helvetica Neue", sans-serif; font-weight: 600; }
  </style>

  <!-- ① イラストエリア（240×185mm）：業者がここに対峙イラストを描き込む。点線と文字はガイドなので印刷しない -->
  <g id="illustration-area" class="guide">
    <rect x="200" y="60" width="2400" height="1850" rx="60" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="40 26" opacity=".55"/>
    <text x="1400" y="330" text-anchor="middle" class="oswald" font-size="72" fill="#fff" opacity=".7" letter-spacing="8">ILLUSTRATION AREA  240 × 185 mm</text>
    <text x="700" y="900" text-anchor="middle" class="oswald" font-size="64" fill="#fff" opacity=".6">BLUE GI</text>
    <text x="700" y="990" text-anchor="middle" class="oswald" font-size="52" fill="#fff" opacity=".45">KONISHI / LEFT → FACING RIGHT</text>
    <text x="2100" y="900" text-anchor="middle" class="oswald" font-size="64" fill="#fff" opacity=".6">BLACK GI</text>
    <text x="2100" y="990" text-anchor="middle" class="oswald" font-size="52" fill="#fff" opacity=".45">OPPONENT / RIGHT → FACING LEFT</text>
  </g>

  <!-- ② ネーム＆所属（イラスト中央下に重ねる） -->
  <g id="name-block">
    <text x="1400" y="1520" text-anchor="middle" class="anton" font-size="240" fill="#fff" letter-spacing="12">MASAHIRO KONISHI</text>
    <text x="1400" y="1650" text-anchor="middle" class="oswald" font-size="96" fill="#fff" letter-spacing="34">OVER LIMIT BJJ</text>
    <!-- 白帯アイコン -->
    <g transform="translate(1400 1760)">
      <rect x="-360" y="-34" width="720" height="68" rx="8" fill="#fff"/>
      <rect x="176" y="-28" width="118" height="56" fill="#000" stroke="#fff" stroke-width="12"/>
      <rect x="-54" y="-50" width="108" height="100" rx="12" fill="#fff" stroke="#000" stroke-width="8"/>
      <path d="M-34 44 L-96 150 L-40 158 L2 50 Z" fill="#fff" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
      <path d="M34 44 L96 150 L40 158 L-2 50 Z" fill="#fff" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ③ タイトルロゴ -->
  <g id="title">
    <text x="1290" y="2290" text-anchor="middle" class="anton" font-size="250" fill="#fff" letter-spacing="8">THE SHITSUKOI</text>
    <!-- 📴 をベクター化した「電源OFFの携帯」アイコン -->
    <g transform="translate(2150 2190) scale(.78)" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round">
      <rect x="-82" y="-128" width="164" height="256" rx="26"/>
      <line x1="-30" y1="102" x2="30" y2="102"/>
      <path d="M-40 -32 A 56 56 0 1 0 40 -32"/>
      <line x1="0" y1="-64" x2="0" y2="0"/>
    </g>
    <text x="1400" y="2700" text-anchor="middle" class="anton" font-size="350" fill="#fff" letter-spacing="12">SWITCH HANDLER</text>
  </g>

  <line x1="500" y1="2870" x2="2300" y2="2870" stroke="#fff" stroke-width="8"/>

  <!-- ④ メッセージ -->
  <g id="message" class="oswald" font-size="118" fill="#fff" text-anchor="middle" letter-spacing="8">
    <text x="1400" y="3050">HE IS AN OUTSTANDING LAWYER</text>
    <text x="1400" y="3210">BECAUSE HE COMMITS TO RESULTS</text>
    <text x="1400" y="3370">MORE PERSISTENTLY THAN ANY OTHER.</text>
  </g>
</svg>
