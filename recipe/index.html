<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
/* 携帯で片手：表紙→レシピ帖の案内→検索と絞り込み→写真2列のカード。料理をタップすると全面でレシピ */
:root{
  --bg:#FDF6F7; --card:#FFFFFF; --ink:#3B2A31; --sub:#8A6F77; --pink:#C4577A; --rose:#E9A3B6; --pale:#F8E1E7; --line:#F0D6DE; --leaf:#7FA37A; --chipfg:#FFFFFF;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-hand:"Klee One","Zen Maru Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1F171A;--card:#2A2024;--ink:#F5E8EC;--sub:#C4A8B1;--pink:#EE93AF;--rose:#B9677F;--pale:#3A2A30;--line:#45333B;--leaf:#9CC296;--chipfg:#1F171A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F171A;--card:#2A2024;--ink:#F5E8EC;--sub:#C4A8B1;--pink:#EE93AF;--rose:#B9677F;--pale:#3A2A30;--line:#45333B;--leaf:#9CC296;--chipfg:#1F171A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* 表紙 */
.cover{position:relative;text-align:center;padding-block:34px 22px;overflow:hidden}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cover .eyebrow{font-family:var(--f-hand);color:var(--pink);font-size:14px;letter-spacing:.12em;position:relative}
.cover h1{position:relative;font-family:var(--f-display);font-size:32px;letter-spacing:.14em;margin:6px 0 4px;text-wrap:balance}
.cover p{position:relative;margin:0;color:var(--sub);font-size:13px}
.cover .n{font-family:var(--f-display);color:var(--pink);font-size:18px;font-variant-numeric:tabular-nums}

/* レシピ帖の案内 */
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.book{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;border:1px solid var(--line)}
.book .s{font-family:var(--f-display);font-size:16px}
.book .c{font-size:11px;color:var(--sub)}
.book .p{font-family:var(--f-display);color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.year{margin-top:8px;border-radius:20px;padding:14px 16px;background:var(--pale);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.year .l{flex:1;min-width:0}
.year b{font-family:var(--f-display);font-size:18px;display:block}
.year small{color:var(--sub);font-size:12px;display:block}
.year .r{text-align:right}
.year s{color:var(--sub);font-size:13px}
.year .p{font-family:var(--f-display);color:var(--pink);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-family:var(--f-hand);font-size:12px;background:var(--pink);color:var(--chipfg);border-radius:999px;padding:1px 10px;margin-bottom:2px}
.demo{margin-top:10px;font-size:12px;color:var(--sub);text-align:center}

/* 検索と絞り込み */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 6px;margin-top:14px}
#q{width:100%;font:inherit;font-size:16px;padding:11px 18px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);outline:none}
#q:focus-visible{border-color:var(--pink);outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rose);color:var(--pink);background:var(--card);border-radius:999px;padding:3px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--chipfg)}
.ings .chip{border-color:var(--line);color:var(--ink);background:var(--card)}
.ingl{flex:none;font-size:12px;color:var(--sub);align-self:center}
.seasons .chip{border-color:var(--line);color:var(--sub)}
.seasons .chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--chipfg)}
.count{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

/* 一覧 */
section{margin-top:22px}
h2{font-family:var(--f-display);font-size:19px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
h2::before{content:"✿";color:var(--rose);font-size:14px}
h2 small{font-family:var(--f-body);font-size:12px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;height:100%;background:var(--card);border:0;border-radius:20px;padding:8px 8px 10px;text-align:left;cursor:pointer;width:100%}
.ph{position:relative;display:block;aspect-ratio:1/1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--pale)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--rose);font-size:28px}
.tagfree,.taglock{position:absolute;top:6px;left:6px;font-family:var(--f-hand);font-size:11px;border-radius:999px;padding:0 8px}
.tagfree{background:var(--pink);color:var(--chipfg)}
.taglock{background:var(--card);color:var(--sub)}
.item .t{display:block;font-family:var(--f-display);font-size:14px;line-height:1.45;margin:8px 4px 2px;overflow-wrap:anywhere}
.item .m{display:block;font-size:11px;color:var(--sub);margin:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--sub);text-align:center;padding:40px 0}
mark{background:var(--pale);color:inherit;border-radius:3px}

/* レシピを開いたとき */
#detail{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.dbar{position:sticky;top:0;z-index:1;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:14px}
.dbar .count{margin-left:auto}
.dbody{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:4px calc(env(safe-area-inset-bottom,0px) + 48px)}
.dbody .photo{width:100%;max-width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px;display:block}
.dbody h2{font-size:22px;margin-top:16px;line-height:1.45;display:block}
.dbody h2::before{content:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.tag{font-size:12px;background:var(--pale);color:var(--sub);border-radius:999px;padding:1px 10px}
.yield{font-size:13px;color:var(--sub)}
h3{font-family:var(--f-display);font-size:17px;color:var(--pink);margin:22px 0 6px;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1px;background:var(--line)}
h4{font-size:13px;margin:10px 0 2px;color:var(--sub);font-weight:700}
.ing{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;padding:4px 14px}
.ing{max-width:520px}
.ing li{display:flex;align-items:baseline;gap:6px;padding:6px 0}
.ing li span:first-child{min-width:0}
.ing li i{flex:1 1 12px;min-width:12px;border-bottom:2px dotted var(--rose);opacity:.7;transform:translateY(-4px)}
.ing li span:last-child{text-align:right;color:var(--ink);flex:0 1 auto;max-width:60%;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s var(--start,0)}
ol.steps li{position:relative;padding:6px 0 6px 38px;counter-increment:s}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--pale);color:var(--pink);font-weight:700;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tips{background:var(--card);border-radius:16px;padding:10px 14px;font-family:var(--f-hand);font-size:14px}
.tips ul{margin:0;padding-left:1.2em}
.src{font-size:11px;color:var(--sub);margin-top:18px}
.pay{margin-top:16px;background:var(--card);border:1.5px dashed var(--rose);border-radius:22px;padding:18px 16px;text-align:center}
.pay>b{font-family:var(--f-display);font-size:18px;display:block}
.pay .sub{font-size:12px;color:var(--sub)}
.plans{display:grid;gap:6px;margin:12px 0;text-align:left}
.plans div{display:flex;align-items:baseline;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:5px}
.plans span:first-child{flex:1;min-width:0}
.plans .c{font-size:12px;color:var(--sub)}
.plans .p{font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.plans .best span:first-child{font-weight:700;color:var(--pink)}
.plans .best .p{color:var(--pink)}
.plans s{font-size:12px;color:var(--sub)}
.pay button{margin-top:8px;border:0;background:var(--pink);color:var(--chipfg);font-weight:700;border-radius:999px;padding:11px 24px;cursor:not-allowed}
.pay small{display:block;color:var(--sub);margin-top:6px;font-size:11px}
.doc{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer}
.doc .ic{flex:none;font-size:22px}
.doc b{display:block;font-family:var(--f-display);font-size:15px}
.doc small{display:block;color:var(--sub);font-size:12px;line-height:1.5}
.readcard{display:flex;gap:12px;align-items:center;width:100%;margin-top:18px;background:var(--pale);border:0;border-radius:20px;padding:14px 16px;text-align:left;cursor:pointer}
.readcard .ic{flex:none;width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-display);color:var(--pink);font-size:15px}
.readcard b{display:block;font-family:var(--f-display);font-size:16px}
.readcard small{display:block;color:var(--sub);font-size:12px;line-height:1.5}
.golink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1.5px solid var(--rose);background:var(--card);color:var(--pink);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:14px}
.article .lead{color:var(--sub);font-size:13px}
.article h3{margin-top:26px}
.article p{margin:8px 0}
.article ul{padding-left:1.3em;margin:6px 0}
.article h5{font-size:14px;margin:12px 0 2px}
.article .hand{font-family:var(--f-hand);color:var(--pink)}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tbl th{background:var(--pale)}
.keybar{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.keybtn{border:1.5px solid var(--pink);background:var(--card);color:var(--pink);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:14px}
.owned{font-family:var(--f-hand);color:var(--leaf)}
#unlock{position:fixed;inset:0;z-index:20;background:rgba(40,20,28,.45);display:grid;place-items:center;padding:16px}
#unlock .box{width:100%;max-width:420px;background:var(--bg);border-radius:24px;padding:22px 18px;text-align:center}
#unlock b{font-family:var(--f-display);font-size:18px;display:block}
#unlock p{font-size:13px;color:var(--sub);margin:6px 0 12px}
#pass{width:100%;font:inherit;font-size:17px;padding:11px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-align:center}
#unlock .row{display:flex;gap:8px;margin-top:12px}
#unlock .row button{flex:1;border-radius:999px;padding:10px;font-weight:700;cursor:pointer;border:0}
#go{background:var(--pink);color:var(--chipfg)}
#cancel{background:var(--pale);color:var(--ink)}
#msg{min-height:1.6em;font-size:13px;margin-top:10px}
#msg.ok{color:var(--leaf)} #msg.ng{color:var(--pink)}
.tagopen{position:absolute;top:6px;left:6px;font-family:var(--f-hand);font-size:11px;border-radius:999px;padding:0 8px;background:var(--leaf);color:var(--chipfg)}
.haskey{margin-top:10px;border:0;background:transparent;color:var(--pink);text-decoration:underline;cursor:pointer;font-size:13px}
@media (prefers-reduced-motion:no-preference){#detail{animation:up .2s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<div class="wrap">
  <div class="cover">
    <canvas id="petals" aria-hidden="true"></canvas>
    <div class="eyebrow">料理教室のレシピを、いつでも</div>
    <h1>和食レシピ帖</h1>
    <p>季節の和食 <span class="n" id="total"></span> 品・展示用サンプル</p>
  </div>
  <div id="shop" hidden>
    <div class="year"><div class="l"><span class="badge">会員</span><b>全部のレシピが読み放題</b><small>いまある<span id="nall"></span>品＋毎月5品ずつ新しいレシピが増えます</small></div></div>

    <span class="count" id="count"></span>
  </div>
  <main id="list"></main>
</div>
<div id="detail" hidden></div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = (s, q) => { s = esc(s); return q ? s.split(esc(q)).join("<mark>" + esc(q) + "</mark>") : s; };
const hay = r => [r.title, r.g, ...(r.tags?.ingredients||[]), ...(r.ingredients||[]).flatMap(g => [g.group, ...(g.items||[]).map(i => i.name)])].join(" ");
// 材料名のゆれ（漢字・ひらがな・カタカナ）をそろえて探す。先頭が代表の書き方
const SYN = [["たまねぎ","玉ねぎ","玉葱"],["しんたま","新玉"],["ながねぎ","長ねぎ","長葱"],["ねぎ","葱"],["にんじん","人参"],["だいこん","大根"],["かぶ","蕪"],["なす","茄子"],["きゅうり","胡瓜"],["しょうが","生姜"],["にんにく","大蒜"],["ごぼう","牛蒡"],["れんこん","蓮根"],["かぼちゃ","南瓜"],["さつまいも","薩摩芋"],["さといも","里芋"],["じゃがいも","馬鈴薯"],["とうがん","冬瓜"],["みょうが","茗荷"],["しそ","大葉","紫蘇"],["はくさい","白菜"],["たけのこ","筍"],["しいたけ","椎茸"],["まいたけ","舞茸"],["そらまめ","空豆","そら豆"],["えだまめ","枝豆"],["とうもろこし","玉蜀黍"],["ゆず","柚子"],["すだち","酢橘"],["ごま","胡麻"],["たまご","玉子","卵"],["えび","海老"],["いか","烏賊"],["たこ","蛸"],["あじ","鯵"],["いわし","鰯"],["さば","鯖"],["さけ","鮭","しゃけ"],["かつお","鰹"],["ぶり","鰤"],["たい","鯛"],["さわら","鰆"],["さんま","秋刀魚"],["あわび","鮑"],["ほたて","帆立"],["はまぐり","蛤"],["あさり","浅蜊"],["かき","牡蠣"],["ふき","蕗"],["とりにく","鶏肉"],["ぶたにく","豚肉"],["ぎゅうにく","牛肉"]];
const norm = t => { t = String(t).normalize("NFKC").replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  for (const g of SYN) for (const v of g.slice(1)) t = t.split(v).join(g[0]); return t; };
// よく使う材料（押すだけで探せる）
const TOP = (() => { const c = {}, show = {}; R.forEach(r => (r.tags?.ingredients||[]).forEach(w => { const k = norm(w); c[k] = (c[k]||0) + 1; show[k] = show[k] || w; }));
  return Object.keys(c).filter(k => k.length > 1 && !/米|水|出汁|だし|油|塩|醤油|しょうゆ|みそ|味噌|酒|砂糖/.test(k)).sort((a, b) => c[b] - c[a]).slice(0, 18).map(k => show[k]); })();
R.forEach(r => { r._h = norm(hay(r)); });
const n = b => R.filter(r => r.b === b).length;
$("#total").textContent = R.length; if ($("#nall")) $("#nall").textContent = R.length;
if (DEMO) {
  $("#shop").hidden = false;
  const showOwned = () => { const o = ["春","夏","秋冬"].filter(has); $("#owned").textContent = o.length ? "✓ 会員として読めます" : ""; };
  showOwned();
  const ul = $("#unlock"), openUl = () => { ul.hidden = false; $("#msg").textContent = ""; $("#msg").className = ""; setTimeout(() => $("#pass").focus(), 50); };
  $("#keybtn").onclick = openUl; window.openUl = openUl;
  $("#cancel").onclick = () => { ul.hidden = true; };
  const tryPass = async () => { const m = $("#msg"); m.className = ""; m.textContent = "確かめています…";
    let got = null; try { got = await unlock($("#pass").value); } catch (e) {}
    if (got) { m.className = "ok"; m.textContent = "全部のレシピが読めるようになりました"; showOwned(); draw(); const h = location.hash.slice(1); if (h) route(h); setTimeout(() => { ul.hidden = true; }, 1200); }
    else { m.className = "ng"; m.textContent = "合言葉が違うようです。いちばん新しいメールの合言葉をご確認ください。"; } };
  $("#go").onclick = tryPass; $("#pass").onkeydown = e => { if (e.key === "Enter") tryPass(); };
  $("#demo").textContent = `展示用サンプルです。「無料」の3品は最後まで、ほかは途中まで。会員の合言葉「みほん」を入れると全部読めます。`;
}
const PAY = r => `<div class="pay"><b>続きは会員になると読めます</b><span class="sub">全部のレシピと毎月の新しいレシピが読み放題</span><div class="plans"><div class="best"><span>レシピ帖 会員</span><span class="c">${R.length}品＋毎月5品</span></div></div><button type="button" disabled>会員になる（準備中）</button><small>見本のため、このボタンはまだ動きません</small><button class="haskey" type="button" onclick="openUl()">会員の方はこちら（合言葉を入れる）</button></div>`;
let genre = "すべて", book = "";
function chips() {
  $("#ings").innerHTML = `<span class="ingl">材料から</span>` + TOP.map(w => `<button class="chip" id="w-${w}" data-w="${w}">${w}</button>`).join("");
  $("#genres").innerHTML = ["すべて", ...GENRES].map(g => `<button class="chip" id="g-${g}" aria-pressed="${g===genre}" data-g="${g}">${g}</button>`).join("");
  $("#seasons").innerHTML = BOOKS.map(b => `<button class="chip" id="s-${b}" aria-pressed="${b===book}" data-s="${b}">${b}</button>`).join("");
}
$("#genres").onclick = e => { const g = e.target.dataset.g; if (!g) return; genre = g; chips(); draw(); };
$("#ings").onclick = e => { const w = e.target.dataset.w; if (!w) return; $("#q").value = $("#q").value.trim() === w ? "" : w; draw(); };
$("#seasons").onclick = e => { const s = e.target.dataset.s; if (!s) return; book = book === s ? "" : s; chips(); draw(); };
const card = (r, q) => `<button class="item" id="i-${r.id}" data-id="${r.id}"><span class="ph">${r.photo ? `<img src="${esc(r.photo)}" alt="" loading="lazy">` : `<span class="none">✿</span>`}${DEMO ? (r.locked ? (has(r.b) ? `<span class="tagopen">✓</span>` : `<span class="taglock">会員</span>`) : `<span class="tagfree">無料</span>`) : ""}</span><span class="t">${hl(r.title, q)}</span><span class="m">${esc((r.tags?.ingredients||[]).slice(0,3).join("・"))}</span></button>`;
function draw() {
  const q = $("#q").value.trim();
  const terms = norm(q).split(/\s+/).filter(Boolean);
  const hits = R.filter(r => terms.every(t => r._h.includes(t)) && (genre === "すべて" || r.g === genre) && (!book || r.b === book));
  $("#count").textContent = `${hits.length}品`;
  if (DEMO) hits.sort((a, b) => (a.locked ? 1 : 0) - (b.locked ? 1 : 0));
  const groups = (genre === "すべて" ? GENRES : [genre]).map(g => [g, hits.filter(r => r.g === g)]).filter(([, L]) => L.length);
  const rq = [];
  const readHtml = rq.map(x => `<button class="readcard" id="rc-${x.id}" data-read="${x.id}"><span class="ic">読</span><span><b>読み物：${esc(x.title)}</b><small>${esc(x.lead)}</small></span></button>`).join("");
  $("#list").innerHTML = readHtml + (groups.length ? groups.map(([g, L]) => `<section><h2>${g}<small>${L.length}品</small></h2><div class="grid">${L.map(r => card(r, q)).join("")}</div></section>`).join("")
    : (readHtml ? "" : `<p class="empty">「${esc(q)}」に合う料理は見つかりませんでした。<br>ひらがなや漢字を変えて探してみてください。</p>`));
}
$("#list").onclick = e => { const rc = e.target.closest(".readcard"); if (rc) return openRead(rc.dataset.read, true); const b = e.target.closest(".item"); if (b) open(b.dataset.id, true); };
$("#q").oninput = draw;
async function open(id, push) {
  let r = R.find(x => x.id === id); if (!r) return;
  if (r.locked && has(r.b)) { try { const full = await openItem(r.id, r.b); if (full) r = { ...r, steps: full.steps, tips: full.tips, locked: false }; } catch (e) {} }
  let k = 0;
  const ing = (r.ingredients||[]).map(g => (g.group ? `<h4>${esc(g.group)}</h4>` : "") + `<ul class="ing">${(g.items||[]).map(i => `<li><span>${esc(i.name)}</span><i></i><span>${esc(i.amount||"")}</span></li>`).join("")}</ul>`).join("");
  const st = (r.steps||[]).map(g => (g.group ? `<h4>${esc(g.group)}</h4>` : "") + `<ol class="steps" style="--start:${k}">${(g.items||[]).map(s => (k++, `<li>${esc(s)}</li>`)).join("")}</ol>`).join("");
  $("#detail").innerHTML = `<div class="dbar"><button class="back" id="back">← もどる</button><span class="count">${esc(r.g)}・${esc(r.b)}</span></div>
    <article class="dbody">${r.photo ? `<img class="photo" src="${esc(r.photo)}" alt="${esc(r.title)}">` : ""}
    <h2>${esc(r.title)}</h2>
    <div class="meta">${(r.tags?.ingredients||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    ${r.yield ? `<div class="yield">分量：${esc(r.yield)}</div>` : ""}
    <h3>材料</h3>${ing}<h3>作り方</h3>${st}
    ${READS.filter(x => x.links.includes(r.id)).map(x => `<h3>資料</h3><button class="doc" id="go-${x.id}" data-read="${x.id}"><span class="ic">📄</span><span><b>${esc(x.title)}</b><small>${esc(x.lead)}</small></span></button>`).join("")}
    ${r.locked ? PAY(r) : ""}
    ${!r.locked && (r.tips||[]).length ? `<h3>先生のコツ・メモ</h3><div class="tips"><ul>${r.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    <div class="src">No.${esc(r.id.slice(1))}</div></article>`;
  $("#detail").hidden = false; $("#detail").scrollTop = 0; document.body.style.overflow = "hidden";
  $("#back").onclick = () => history.length > 1 && location.hash ? history.back() : close();
  $("#detail").querySelectorAll(".doc").forEach(b => b.onclick = () => openRead(b.dataset.read, true));
  if (push) history.pushState(null, "", "#" + id);
}
async function openRead(id, push) {
  let x = READS.find(y => y.id === id); if (!x) return;
  if (x.locked && has("通年")) { try { const full = await openItem("read-" + x.id, "通年"); if (full) x = { ...x, sections: full.sections, locked: false }; } catch (e) {} }
  const recipes = R.filter(r => x.links.includes(r.id));
  $("#detail").innerHTML = `<div class="dbar"><button class="back" id="back">← もどる</button><span class="count">資料</span></div>
    <article class="dbody article"><h2>${esc(x.title)}</h2><p class="lead">${esc(x.lead)}</p>
    ${x.sections.map(sc => `<h3>${esc(sc.h)}</h3>${sc.html}`).join("")}
    ${x.locked ? `<div class="pay"><b>続きはレシピ帖で読めます</b><span class="sub">この資料（全${x.total}項目）は会員になると読めます</span><div class="plans"><div class="best"><span>レシピ帖 会員</span><span class="c">${R.length}品＋毎月5品</span></div></div><button type="button" disabled>会員になる（準備中）</button><small>見本のため、このボタンはまだ動きません</small><button class="haskey" type="button" onclick="openUl()">会員の方はこちら（合言葉を入れる）</button></div>` : ""}
    ${recipes.map(r => `<button class="golink" data-id="${r.id}">← ${esc(r.title)}に戻る</button>`).join("")}</article>`;
  $("#detail").hidden = false; $("#detail").scrollTop = 0; document.body.style.overflow = "hidden";
  $("#back").onclick = () => history.length > 1 && location.hash ? history.back() : close();
  $("#detail").querySelectorAll(".golink[data-id]").forEach(b => b.onclick = () => open(b.dataset.id, true));
  if (push) history.pushState(null, "", "#read-" + id);
}

function close() { $("#detail").hidden = true; document.body.style.overflow = ""; }
const route = h => h.startsWith("read-") ? openRead(h.slice(5), false) : open(h, false);
window.addEventListener("popstate", () => { const id = location.hash.slice(1); id ? route(id) : close(); });
chips(); draw();
if (location.hash.length > 1) route(location.hash.slice(1));

// 表紙の花びら（止まった絵として描く。動きを減らす設定なら動かさない）
(function petals(){
  const c = $("#petals"), x = c.getContext("2d"); if (!x) return;
  const css = getComputedStyle(document.documentElement);
  const col = [css.getPropertyValue("--rose").trim() || "#E9A3B6", css.getPropertyValue("--pale").trim() || "#F8E1E7"];
  let W, H, P;
  const size = () => { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); };
  const seed = () => { P = Array.from({length: 14}, (_, i) => ({ x: (i * 97) % 100 / 100 * W, y: (i * 53) % 100 / 100 * H, r: 5 + (i % 4) * 2, a: i, v: .15 + (i % 5) * .05, c: col[i % 2] })); };
  const petal = p => { x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = .55; x.fillStyle = p.c;
    x.beginPath(); x.moveTo(0, -p.r); x.quadraticCurveTo(p.r, 0, 0, p.r); x.quadraticCurveTo(-p.r, 0, 0, -p.r); x.fill(); x.restore(); };
  const frame = () => { x.clearRect(0, 0, W, H); P.forEach(petal); };
  size(); seed(); frame();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const tick = () => { P.forEach(p => { p.y += p.v; p.x += Math.sin(p.a) * .2; p.a += .004; if (p.y > H + 10) p.y = -10; }); frame(); requestAnimationFrame(tick); };
  addEventListener("resize", () => { size(); seed(); frame(); });
  requestAnimationFrame(tick);
})();
</script>

</body></html>
