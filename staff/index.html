<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>スタッフページ</title>
<style>body{font-family:"Hiragino Sans",sans-serif;background:#FAF9F5;color:#211E19;
display:flex;align-items:center;justify-content:center;min-height:90vh;margin:0}
.box{text-align:center;padding:24px}.box h1{font-size:18px}.box p{font-size:13px;color:#8B8578}</style>
</head><body>
<div class="box" id="msg"><h1>読み込み中…</h1></div>
<script>
(async function(){
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  const show = (t, s) => { document.getElementById('msg').innerHTML = '<h1>'+t+'</h1><p>'+s+'</p>'; };
  if(!m){ show('このページは鍵付きリンク専用です', '共有された正しいURL(#k=〜付き)から開いてください'); return; }
  try{
    let ks = m[1].replace(/-/g,'+').replace(/_/g,'/');
    while(ks.length % 4) ks += '=';
    const kb = Uint8Array.from(atob(ks), c=>c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
    const res = await fetch('data.enc?' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('fetch ' + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: buf.slice(0,12)}, key, buf.slice(12));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    show('開けませんでした', 'リンクが正しいか確認してください（' + e.message + '）');
  }
})();
</script></body></html>
