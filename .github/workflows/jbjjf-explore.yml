name: JBJJF エントリーリスト URL の列挙

# Wayback Machine から jbjjf.com の公開エントリーリスト URL を列挙する一時ワークフロー（URL のみ出力）。
on:
  push:
    branches: [claude/focused-noether-xnruny]
    paths:
      - "tools/jbjjf/list_urls.py"
      - ".github/workflows/jbjjf-explore.yml"

permissions:
  contents: read

jobs:
  urls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/jbjjf/list_urls.py
