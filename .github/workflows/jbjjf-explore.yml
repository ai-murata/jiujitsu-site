name: JBJJF エントリーリストの集計

# jbjjf.com の公開エントリーリスト（2023〜2026年）を集めて集計する一時ワークフロー。
# 出力は集計値（人数・割合・道場名ごとの件数）だけ。氏名は出力しない。
on:
  push:
    branches: [claude/focused-noether-xnruny]
    paths:
      - "tools/jbjjf/**"
      - ".github/workflows/jbjjf-explore.yml"

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/jbjjf/scrape.py
