name: サイト内検索の索引

# ページ（*.html）が変わったら search/index.json を作り直してコミットする。
# ほかのワークフロー（補助金・ニュースなど）が bot として push したぶんは
# この push トリガーでは拾えないので、毎朝も1回作り直す。
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "tools/search/**"
      - ".github/workflows/search.yml"
  pull_request:
    paths:
      - "tools/search/**"
      - ".github/workflows/search.yml"
  schedule:
    - cron: "0 23 * * *" # 23:00 UTC = 08:00 JST（補助金・ニュースの更新のあと）
  workflow_dispatch:

permissions:
  contents: write

concurrency: search

jobs:
  search:
    name: 索引を作り直す
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 索引を作り直す
        run: python3 tools/search/build.py

      - name: テスト（ネットワーク不要）
        run: python3 tools/search/test_build.py

      - name: 変更があればコミット
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search/index.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(search): サイト内検索の索引を更新"
          # このジョブが触るのは search/index.json だけなので、弾かれたら取り込んで作り直す。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push が弾かれました。リモートを取り込んで再試行します ($attempt/3)"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python3 tools/search/build.py
            git add search/index.json
            if git diff --staged --quiet; then exit 0; fi
            git commit -m "chore(search): サイト内検索の索引を更新"
          done
          echo "3回試しても push できませんでした" >&2
          exit 1
